<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Web TVBox 影視中心</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f0f; color: #f1f1f1; margin: 0; padding: 12px; }
        
        /* 頂部操作列響應式流動佈局 */
        .header { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; background: #181818; padding: 10px 12px; border-radius: 8px; }
        select, input, button { padding: 8px 10px; border-radius: 6px; border: 1px solid #333; background: #222; color: #fff; font-size: 14px; outline: none; }
        button { cursor: pointer; background: #2a2a2a; border: 1px solid #444; font-weight: 500; transition: background 0.2s; touch-action: manipulation; }
        button:active { background: #383838; }
        .btn-upload { background: #005533; border-color: #008855; color: #fff; font-weight: bold; white-space: nowrap; }
        
        .header-row-selects { display: flex; gap: 6px; align-items: center; flex: 1 1 auto; }
        .header-row-selects select { flex: 1; min-width: 100px; }

        .search-box { display: flex; gap: 6px; width: 100%; margin-top: 4px; }
        .search-box input { flex: 1; background: #121212; border: 1px solid #3a3a3a; }
        .search-box button { flex-shrink: 0; padding: 8px 16px; }

        .ad-switch-box { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #00ff88; background: #1e2a22; padding: 6px 10px; border-radius: 6px; border: 1px solid #235534; width: 100%; }
        .ad-switch-box input[type="checkbox"] { cursor: pointer; width: 16px; height: 16px; accent-color: #00cc66; }

        /* 主排版 */
        .main-layout { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 16px; }
        @media (min-width: 900px) {
            body { padding: 20px; }
            .header { padding: 10px 16px; margin-bottom: 15px; }
            .header-row-selects { flex: 0 1 auto; }
            .search-box { width: auto; margin-top: 0; margin-left: auto; }
            .search-box input { width: 220px; }
            .ad-switch-box { width: auto; margin-left: 8px; font-size: 13px; }
            .main-layout { grid-template-columns: 1fr 340px; gap: 20px; margin-bottom: 20px; }
        }
        
        .player-column { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
        .player-box { background: #000; border-radius: 8px; overflow: hidden; position: relative; user-select: none; width: 100%; }
        
        /* 方案 A：偽全螢幕 (CSS Fullscreen)，徹底解決 iPhone / Safari 全螢幕圖層按鈕被系統吃掉的問題 */
        .player-box.pseudo-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 99999 !important;
            border-radius: 0 !important;
            background: #000 !important;
        }
        .player-box:fullscreen { width: 100vw !important; height: 100vh !important; border-radius: 0; }
        .player-box:-webkit-full-screen { width: 100vw !important; height: 100vh !important; border-radius: 0; }
        
        .player-box.hide-cursor { cursor: none !important; }
        .player-box.hide-cursor * { cursor: none !important; }
        
        .video-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(rgba(0,0,0,0.88), transparent);
            padding: 14px 16px 24px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-in-out;
            z-index: 1000;
            display: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-box:fullscreen .video-top-bar,
        .player-box:-webkit-full-screen .video-top-bar,
        .player-box.pseudo-fullscreen .video-top-bar {
            display: block;
        }
        .video-top-bar.show { opacity: 1; }
        
        /* 自適應 16:9 比例 */
        video { width: 100%; aspect-ratio: 16 / 9; height: auto; max-height: 70vh; background: #000; display: block; cursor: pointer; }
        .player-box:fullscreen video,
        .player-box:-webkit-full-screen video,
        .player-box.pseudo-fullscreen video { height: 100vh !important; max-height: 100vh !important; aspect-ratio: auto; }
        
        /* 畫面中央：所有源失效時的保底重試浮層 (高層級 z-index: 3000，防穿透防誤觸) */
        .speed-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 15, 15, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            padding: 14px 22px;
            border-radius: 12px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 3000;
            pointer-events: auto;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.85);
        }
        .speed-overlay.show { display: flex; }
        .speed-text { font-size: 14px; color: #ffcc00; font-family: monospace; font-weight: bold; }
        .speed-hint { font-size: 12px; color: #ddd; max-width: 260px; line-height: 1.4; }
        .speed-btn-group { display: flex; gap: 8px; margin-top: 4px; }
        .speed-btn {
            background: #e50914;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }
        .speed-btn:hover { background: #b20710; }
        .speed-btn-close {
            background: #333;
            color: #ccc;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(transparent, rgba(0,0,0,0.95));
            display: flex;
            flex-direction: column;
            padding: 8px 12px 10px;
            gap: 6px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-in-out;
            z-index: 1000;
        }
        .custom-controls.show { opacity: 1; pointer-events: auto; }

        .progress-bar-wrap { width: 100%; height: 20px; display: flex; align-items: center; cursor: pointer; position: relative; touch-action: none; }
        .progress-bar-bg { width: 100%; height: 5px; background: rgba(255,255,255,0.3); border-radius: 3px; position: relative; }
        .progress-bar-fill { height: 100%; background: #e50914; border-radius: 3px; width: 0%; pointer-events: none; }

        .controls-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .controls-left, .controls-right { display: flex; align-items: center; gap: 10px; }
        .ctrl-btn { background: none; border: none; color: #fff; cursor: pointer; font-size: 16px; padding: 6px 8px; display: flex; align-items: center; justify-content: center; }
        .ctrl-btn:active { color: #e50914; }
        .time-display { font-size: 11px; color: #ddd; font-family: monospace; user-select: none; white-space: nowrap; }

        .volume-box { display: flex; align-items: center; gap: 6px; }
        .volume-slider { -webkit-appearance: none; appearance: none; width: 60px; height: 4px; background: #555; border-radius: 3px; outline: none; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; cursor: pointer; }
        @media (max-width: 600px) {
            .volume-slider { display: none; }
            .time-display { font-size: 10px; }
            .ctrl-btn { padding: 4px 6px; font-size: 15px; }
            .controls-left, .controls-right { gap: 6px; }
        }

        .seek-ripple {
            position: absolute;
            top: 50%;
            transform: translateY(-50%) scale(0.7);
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            backdrop-filter: blur(6px);
            z-index: 2000;
        }
        .seek-ripple.active { opacity: 1; transform: translateY(-50%) scale(1.05); }
        #ripple-left { left: 10%; }
        #ripple-right { right: 10%; }

        .skip-toast {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 204, 102, 0.95);
            color: #000;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: none;
            z-index: 3500;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            pointer-events: none;
            white-space: nowrap;
        }

        .player-bottom-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #181818; border: 1px solid #2a2a2a; border-radius: 8px; }
        .playing-title { font-size: 14px; font-weight: bold; word-break: break-all; }
        .op-ed-wrap { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
        .skip-btn { background: #252525; border: 1px solid #444; color: #ccc; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; white-space: nowrap; }
        .skip-btn.active { background: #193322; border-color: #00cc66; color: #00ff88; font-weight: bold; }

        .episodes-box { background: #181818; border-radius: 8px; padding: 12px; max-height: 380px; overflow-y: auto; }
        .episodes-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .episodes-title { font-weight: bold; font-size: 14px; }
        .server-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
        .server-btn { background: #222; border: 1px solid #3a3a3a; color: #aaa; padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .server-btn.active { background: #005533; border-color: #00aa66; color: #fff; font-weight: bold; }
        
        .fav-btn { background: #252525; border: 1px solid #444; color: #bbb; padding: 4px 10px; border-radius: 20px; font-size: 12px; cursor: pointer; }
        .fav-btn.active { color: #ffbb00; border-color: #ffaa00; background: #2f2717; font-weight: bold; }

        .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; }
        .ep-btn { padding: 8px 4px; font-size: 12px; background: #222; border: 1px solid #333; color: #bbb; text-align: center; border-radius: 4px; cursor: pointer; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .ep-btn.active { background: #cc0000; border-color: #cc0000; color: #fff; font-weight: bold; }

        .history-section { background: #181818; border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; }
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .history-title { font-size: 13px; font-weight: bold; color: #00cc66; }
        .history-clear-btn { background: transparent; border: none; color: #888; font-size: 11px; cursor: pointer; padding: 2px 4px; }
        .history-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
        
        .history-card { flex: 0 0 105px; background: #222; border-radius: 6px; overflow: hidden; cursor: pointer; position: relative; border: 1px solid #333; }
        .history-thumb-wrap { width: 100%; height: 140px; position: relative; background: #111; }
        .history-thumb { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
        
        /* 歷史卡片：左上角來源站點標籤（綠底黑字或黑底綠字，清楚辨識） */
        .history-site-tag { position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,0.88); color: #00ff88; font-size: 9.5px; padding: 1px 5px; border-radius: 3px; border: 1px solid rgba(0, 255, 136, 0.45); max-width: 75%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .history-ep-tag { position: absolute; bottom: 3px; right: 3px; background: rgba(0,0,0,0.85); color: #ffcc00; font-size: 9px; padding: 2px 4px; border-radius: 3px; max-width: 92%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .history-info { padding: 4px 6px; }
        .history-name { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-del-btn { position: absolute; top: 3px; right: 3px; background: rgba(0,0,0,0.75); border: none; color: #fff; width: 18px; height: 18px; border-radius: 50%; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        .category-container { background: #161616; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #252525; }
        .category-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; align-items: center; -webkit-overflow-scrolling: touch; }
        .cat-btn { padding: 5px 12px; background: #222; border: 1px solid #3a3a3a; color: #ccc; border-radius: 18px; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .cat-btn.active { background: #e50914; border-color: #e50914; color: #fff; font-weight: bold; }
        .cat-btn.fav-tab { border-color: #ffaa00; color: #ffbb00; }
        .cat-btn.fav-tab.active { background: #ffaa00; color: #000; font-weight: bold; }
        
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 10px; }
        @media (min-width: 600px) {
            .movie-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }
            .history-card { flex: 0 0 120px; }
            .history-thumb-wrap { height: 168px; }
        }
        .movie-card { background: #1c1c1c; border-radius: 6px; overflow: hidden; cursor: pointer; position: relative; }
        .movie-card img { width: 100%; aspect-ratio: 140 / 195; object-fit: cover; background: #252525; display: block; }
        .movie-name { padding: 6px 4px; font-size: 12px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-note { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.75); font-size: 10px; padding: 1px 4px; border-radius: 3px; color: #ff9800; }
        .card-progress-tag { position: absolute; bottom: 28px; right: 4px; background: rgba(0,0,0,0.85); font-size: 9.5px; padding: 1px 5px; border-radius: 3px; color: #00ff88; }
        .card-star-btn { position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; background: rgba(0,0,0,0.75); color: #ffcc00; border: 1px solid rgba(255,204,0,0.6); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; }

        .pagination { display: flex; justify-content: center; gap: 10px; align-items: center; margin: 20px 0; }
        .pagination button { background: #222; color: #fff; padding: 6px 14px; border: 1px solid #3a3a3a; font-size: 13px; }
    </style>
</head>
<body>

    <div class="header">
        <input type="file" id="local-file-input" accept=".txt,.json" style="display:none;" onchange="handleFileUpload(event)">
        <button class="btn-upload" onclick="document.getElementById('local-file-input').click()">📁 載入設定</button>

        <div class="header-row-selects">
            <select id="line-select" onchange="parseSelectedLine(false)"><option value="">請先載入設定檔</option></select>
            <button onclick="parseSelectedLine(false)" style="flex-shrink:0;">解析</button>
            <select id="site-select" onchange="onSiteChange()"><option value="">等待站點...</option></select>
        </div>

        <div class="ad-switch-box">
            <input type="checkbox" id="ai-ad-skip-chk" checked>
            <label for="ai-ad-skip-chk">⚡ 文字精準識別：新葡京 (+17s)</label>
        </div>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="繁簡皆可搜尋..." onkeydown="if(event.key==='Enter') doSearch()">
            <button onclick="doSearch()">搜尋</button>
        </div>
    </div>

    <div class="main-layout">
        <div class="player-column">
            <div class="player-box" id="player-box">
                <div class="video-top-bar" id="video-top-bar">
                    <span id="fs-playing-title">目前尚未播放影片</span>
                </div>

                <!-- 畫面中央：所有源失效時的保底重試浮層 -->
                <div class="speed-overlay" id="speed-overlay" onclick="event.stopPropagation()">
                    <div class="speed-text" id="speed-overlay-val">⚠️ 訊號連線暫時中斷</div>
                    <div class="speed-hint" id="speed-overlay-hint">所有線路嘗試完畢，點擊重試連線</div>
                    <div class="speed-btn-group">
                        <button class="speed-btn" id="speed-btn-action" onclick="handleSpeedOverlayAction(event)">🔄 重新整理線路</button>
                        <button class="speed-btn-close" onclick="closeSpeedOverlay(event)">關閉</button>
                    </div>
                </div>

                <video id="video-player" autoplay playsinline webkit-playsinline crossorigin="anonymous"></video>
                
                <div class="skip-toast" id="skip-toast">⚡ 識別到廣告，已自動跳過 17 秒</div>

                <div class="seek-ripple" id="ripple-left">⏪ 10 秒</div>
                <div class="seek-ripple" id="ripple-right">10 秒 ⏩</div>

                <div class="custom-controls" id="custom-controls">
                    <div class="progress-bar-wrap" id="progress-wrap">
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" id="progress-fill"></div>
                        </div>
                    </div>
                    <div class="controls-row">
                        <div class="controls-left">
                            <button class="ctrl-btn" id="play-btn">▶</button>
                            <div class="volume-box">
                                <button class="ctrl-btn" id="mute-btn">🔊</button>
                                <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.01" value="1">
                            </div>
                            <span class="time-display" id="time-display">00:00 / 00:00</span>
                        </div>
                        <div class="controls-right">
                            <div class="op-ed-wrap" id="op-ed-wrap" style="display: none;">
                                <button class="skip-btn" id="btn-set-op" onclick="event.stopPropagation(); toggleSetOp()">⏭ 記住片頭</button>
                                <button class="skip-btn" id="btn-set-ed" onclick="event.stopPropagation(); toggleSetEd()">⏮ 記住片尾</button>
                            </div>
                            <button class="ctrl-btn" id="fs-btn">⛶ 全螢幕</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="player-bottom-bar">
                <div class="playing-title" id="playing-title">目前尚未播放影片</div>
            </div>
        </div>

        <div class="episodes-box">
            <div class="episodes-header">
                <div class="episodes-title">選集列表</div>
                <button class="fav-btn" id="fav-toggle-btn" onclick="toggleCurrentFavorite()" style="display: none;">☆ 加入最愛</button>
            </div>
            <!-- 多播放源線路切換標籤列 -->
            <div class="server-tabs" id="server-tabs" style="display:none;"></div>
            <div class="episodes-grid" id="episodes-grid">請點選下方影片查看選集</div>
        </div>
    </div>

    <div class="history-section" id="history-section" style="display: none;">
        <div class="history-header">
            <div class="history-title">🕒 最近觀看紀錄</div>
            <button class="history-clear-btn" onclick="clearAllHistory()">清空紀錄</button>
        </div>
        <div class="history-scroll" id="history-scroll"></div>
    </div>

    <div class="category-container">
        <div class="category-row" id="category-row">
            <button class="cat-btn fav-tab" id="fav-tab-btn" onclick="showFavoritesTab(this)">⭐ 我的最愛 (<span id="fav-count">0</span>)</button>
            <button class="cat-btn active" id="btn-cat-all" onclick="changeCategory('', this)">全部最新</button>
            <span id="site-dynamic-categories" style="display: flex; gap: 6px;"></span>
        </div>
    </div>

    <canvas id="ocr-canvas" width="280" height="100" style="display:none;"></canvas>

    <div class="movie-grid" id="movie-grid">載入片庫中...</div>

    <div class="pagination" id="pagination" style="display: none;">
        <button onclick="changePage(-1)">上一頁</button>
        <span id="page-indicator">第 1 頁</span>
        <button onclick="changePage(1)">下一頁</button>
    </div>

    <script>
        const video = document.getElementById('video-player');
        const playerBox = document.getElementById('player-box');
        const customControls = document.getElementById('custom-controls');
        const playBtn = document.getElementById('play-btn');
        const fsBtn = document.getElementById('fs-btn');
        const muteBtn = document.getElementById('mute-btn');
        const volumeSlider = document.getElementById('volume-slider');
        const progressWrap = document.getElementById('progress-wrap');
        const progressFill = document.getElementById('progress-fill');
        const timeDisplay = document.getElementById('time-display');

        const skipToast = document.getElementById('skip-toast');
        const aiAdSkipChk = document.getElementById('ai-ad-skip-chk');
        const rippleLeft = document.getElementById('ripple-left');
        const rippleRight = document.getElementById('ripple-right');
        const favToggleBtn = document.getElementById('fav-toggle-btn');
        const favCountSpan = document.getElementById('fav-count');
        
        const videoTopBar = document.getElementById('video-top-bar');
        const fsPlayingTitle = document.getElementById('fs-playing-title');
        
        const speedOverlay = document.getElementById('speed-overlay');
        const speedOverlayVal = document.getElementById('speed-overlay-val');
        const speedOverlayHint = document.getElementById('speed-overlay-hint');
        const speedBtnAction = document.getElementById('speed-btn-action');
        const serverTabs = document.getElementById('server-tabs');

        const ocrCanvas = document.getElementById('ocr-canvas');
        const ocrCtx = ocrCanvas.getContext('2d', { willReadFrequently: true });
        
        let hlsInstance = null;
        let currentPage = 1;
        let currentTypeId = '';
        let currentSearchWord = '';
        let lastSkipTime = 0;
        let controlsHideTimer = null;
        let previousVolume = 1;

        let currentVod = null;
        let currentEpName = '';

        }

        function togglePlayPause() {

        function applySliderColor(val) {
            const pct = Math.round(val * 100);
            volumeSlider.style.background = `linear-gradient(to right, #e50914 0%, #e50914 ${pct}%, #555 ${pct}%, #555 100%)`;
        }

        function updateVolumeUI() {
            const currentVol = (video.muted) ? 0 : video.volume;
            volumeSlider.value = currentVol;
            applySliderColor(currentVol);

            if (currentVol === 0 || video.muted) {
                muteBtn.textContent = '🔇';
            } else if (currentVol < 0.5) {

            } else {
                muteBtn.textContent = '🔊';
            }
        }

        volumeSlider.addEventListener('input', (e) => {
            e.stopPropagation();
            let val = parseFloat(e.target.value);
            if (val <= 0.02) val = 0;
            if (val >= 0.98) val = 1;

            video.volume = val;
            video.muted = (val === 0);
            updateVolumeUI();
        });

        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (video.muted || video.volume === 0) {
                video.muted = false;
                video.volume = (previousVolume > 0.05) ? previousVolume : 1;
            } else {
                previousVolume = video.volume;
                video.muted = true;
                video.volume = 0;
            }
            updateVolumeUI();
        });

        applySliderColor(1);

        // ==========================================
        // 方案 A：CSS 偽全螢幕 (iPhone iOS & 桌面共通，絕不丟失任何覆蓋圖層與按鈕)
        // ==========================================
        function toggleFullscreen() {
            const isPseudo = playerBox.classList.contains('pseudo-fullscreen');
            const isStandard = document.fullscreenElement || document.webkitFullscreenElement;

            if (!isPseudo && !isStandard) {
                playerBox.classList.add('pseudo-fullscreen');
                if (playerBox.requestFullscreen) {
                    playerBox.requestFullscreen().catch(() => {});
                } else if (playerBox.webkitRequestFullscreen) {
                    playerBox.webkitRequestFullscreen().catch(() => {});
                }
                fsBtn.textContent = '🗗 縮小';
            } else {
                playerBox.classList.remove('pseudo-fullscreen');
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen().catch(() => {});
                }
                fsBtn.textContent = '⛶ 全螢幕';
            }
        }
        fsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleFullscreen();
        });

        function resetControlsTimer() {
            customControls.classList.add('show');
            if (videoTopBar) videoTopBar.classList.add('show');
            playerBox.classList.remove('hide-cursor');
            clearTimeout(controlsHideTimer);

            controlsHideTimer = setTimeout(() => {
                if (!video.paused) {
                    customControls.classList.remove('show');
                    if (videoTopBar) videoTopBar.classList.remove('show');
                    playerBox.classList.add('hide-cursor');
                }
            }, 3000);
        }

        playerBox.addEventListener('mousemove', resetControlsTimer);
        playerBox.addEventListener('mousedown', resetControlsTimer);
        playerBox.addEventListener('touchstart', resetControlsTimer, { passive: true });
        playerBox.addEventListener('mouseleave', () => {
            if (!video.paused) {
                customControls.classList.remove('show');
                if (videoTopBar) videoTopBar.classList.remove('show');
                playerBox.classList.add('hide-cursor');
            }
        });

        function formatTime(s) {
            if (isNaN(s)) return '00:00';
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        }

        function formatProgressChinese(seconds, epName = '') {
            const s = Math.floor(seconds || 0);
            const hrs = Math.floor(s / 3600);
            const mins = Math.floor((s % 3600) / 60);
            const secs = s % 60;

            let timeStr = '';
            if (hrs > 0) {
                timeStr = `${hrs}小時${mins}分${secs}秒`;
            } else {
                timeStr = `${mins}分${secs}秒`;
            }

            if (epName && epName.trim() !== '') {
                return `${epName} ${timeStr}`;
            }
            return timeStr;
        }

        // ==========================================
        // 播放狀態與卡頓逾時 (Buffering 6 秒自動換源)
        // ==========================================
        function clearBufferingTimer() {
            if (bufferingTimeoutTimer) {
                clearTimeout(bufferingTimeoutTimer);
                bufferingTimeoutTimer = null;
            }
        }

        video.addEventListener('waiting', () => {
            clearBufferingTimer();
            if (!video.paused && !video.ended && video.currentTime > 1) {
                // 卡在轉圈超過 6 秒，主動觸發全自動換源
                bufferingTimeoutTimer = setTimeout(() => {
                    const savedTime = Math.floor(video.currentTime || 0);
                    console.warn(`[緩衝卡頓逾時] 卡頓超過 6 秒，觸發自動換源... 秒數: ${savedTime}`);
                    triggerAutoFailover(savedTime, '連線逾時卡頓');
                }, 6000);
            }
        });

        video.addEventListener('playing', () => {
            clearBufferingTimer();
            autoSwitchAttemptCount = 0; // 順暢起播後重設換源計數
            closeSpeedOverlay();
        });

        video.addEventListener('canplay', () => {
            clearBufferingTimer();
        });

        let lastAutoSaveTime = 0;
        video.addEventListener('timeupdate', () => {
            if (!video.duration) return;
            const pct = (video.currentTime / video.duration) * 100;
            progressFill.style.width = `${pct}%`;
            timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;

            const now = Date.now();
            if (now - lastAutoSaveTime > 3000 && currentVod && video.currentTime > 1) {
                lastAutoSaveTime = now;
                syncCurrentProgress(video.currentTime);
            }

            const opEd = getCurrentOpEd();
            if (opEd && opEd.edTail > 0 && video.duration > 0 && !isTriggeringNext && !video.paused) {
                const remain = video.duration - video.currentTime;
                if (remain <= opEd.edTail && video.currentTime > (opEd.op || 30) + 10) {
                    isTriggeringNext = true;
                    playNextEpisode('片尾倒數完畢');
                }
            }
        });

        video.addEventListener('pause', () => {
            clearBufferingTimer();
            if (currentVod && video.currentTime > 1) {
                syncCurrentProgress(video.currentTime);
            }
        });

        video.addEventListener('ended', () => {
            clearBufferingTimer();
            if (!isTriggeringNext) {
                playNextEpisode('本集播放結束');
            }
        });

        function handleSeekEvent(clientX) {
            const rect = progressWrap.getBoundingClientRect();
            let pos = (clientX - rect.left) / rect.width;
            if (pos < 0) pos = 0;
            if (pos > 1) pos = 1;
            if (video.duration) {
                video.currentTime = pos * video.duration;
            }
        }

        progressWrap.addEventListener('click', (e) => {
            e.stopPropagation();
            handleSeekEvent(e.clientX);
        });

        progressWrap.addEventListener('touchmove', (e) => {
            if (e.touches && e.touches[0]) {
                handleSeekEvent(e.touches[0].clientX);
            }
        }, { passive: true });

        function seekVideo(seconds) {
            if (!video || !video.duration) return;
            let targetTime = video.currentTime + seconds;
            if (targetTime < 0) targetTime = 0;
            if (targetTime > video.duration) targetTime = video.duration;
            video.currentTime = targetTime;
        }

        function showRipple(el) {
            el.classList.add('active');
            setTimeout(() => { el.classList.remove('active'); }, 450);
        }

        let clickTimer = null;
        let clickCount = 0;

        video.addEventListener('click', (e) => {
            clickCount++;
            const rect = video.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const isLeftSide = clickX < (rect.width / 2);

            if (clickCount === 1) {
                clickTimer = setTimeout(() => {
                    clickCount = 0;
                    togglePlayPause();
                }, 280);
            } else if (clickCount >= 2) {
                clearTimeout(clickTimer);
                clickTimer = null;
                clickCount = 0;

                if (isLeftSide) {
                    seekVideo(-10);
                    showRipple(rippleLeft);
                } else {
                    seekVideo(10);
                    showRipple(rippleRight);
                }
            }
        });

        function triggerAdSkip(detectedText = '') {
            const now = Date.now();
            if (now - lastSkipTime < 3500) return;
            lastSkipTime = now;

            console.log(`%c[精準命中] 識別到廣告文字:「${detectedText}」，立即快進 17 秒！`, 'color:#00ff00; font-size:14px; font-weight:bold;');
            let target = video.currentTime + 17;
            if (video.duration && target > video.duration) target = video.duration;
            video.currentTime = target;

            skipToast.textContent = `⚡ 識別到「澳門新葡京」，已自動跳過 17 秒`;
            skipToast.style.display = 'block';
            setTimeout(() => { skipToast.style.display = 'none'; }, 2500);
        }

        setInterval(async () => {
            if (!aiAdSkipChk.checked || video.paused || video.ended || !video.duration || isOcrProcessing) return;

            const now = Date.now();
            if (now - lastSkipTime < 3500) return;

            try {
                const vw = video.videoWidth || 640;
                const vh = video.videoHeight || 360;

                const cropX = vw * 0.28;
                const cropY = vh * 0.26;
                const cropW = vw * 0.44;
                const cropH = vh * 0.32;

                ocrCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, 280, 100);

                const imgData = ocrCtx.getImageData(0, 0, 280, 100);
                const d = imgData.data;
                for (let i = 0; i < d.length; i += 4) {
                    const r = d[i], g = d[i+1];
                    if (r > 170 && g > 130) {
                        d[i] = 255; d[i+1] = 255; d[i+2] = 255;
                    } else {
                        d[i] = 0; d[i+1] = 0; d[i+2] = 0;
                    }
                }
                ocrCtx.putImageData(imgData, 0, 0);

                if (ocrWorker) {
                    isOcrProcessing = true;
                    const res = await ocrWorker.recognize(ocrCanvas);
                    isOcrProcessing = false;
                    const text = res.data.text.replace(/\s+/g, '');

                    const hasAoMen = text.includes('澳门') || text.includes('澳門');
                    const hasXinPuJing = text.includes('新葡京');
                    const isAoMenXinPuJing = hasAoMen && hasXinPuJing;

                    const extraKeywords = ['701701', '288588', '娱乐城', '娛樂城', '发财', '發財', '澳门新', '澳門新'];
                    const hasExtraMatch = extraKeywords.some(kw => text.includes(kw));

                    if (isAoMenXinPuJing || hasExtraMatch) {
                        triggerAdSkip(text);
                    }
                }
            } catch (err) {
                isOcrProcessing = false;
            }
        }, 800);

        window.addEventListener('keydown', (e) => {
            if (document.activeElement === document.getElementById('search-input')) return;
            
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                seekVideo(-10);
                showRipple(rippleLeft);
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                seekVideo(10);
                showRipple(rippleRight);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                video.volume = Math.min(1, Math.round((video.volume + 0.1) * 10) / 10);
                video.muted = false;
                updateVolumeUI();
                resetControlsTimer();
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                video.volume = Math.max(0, Math.round((video.volume - 0.1) * 10) / 10);
                updateVolumeUI();
                resetControlsTimer();
            } else if (e.key.toLowerCase() === 'm') {
                e.preventDefault();
                muteBtn.click();
                resetControlsTimer();
            } else if (e.key.toLowerCase() === 'f') {
                e.preventDefault();
                toggleFullscreen();
            } else if (e.key === ' ') {
                e.preventDefault();
                togglePlayPause();
            }
        });

        function syncCurrentProgress(currentTime) {
            if (!currentVod || !currentVod.vod_name) return;

            let favs = getFavorites();
            let favIdx = favs.findIndex(f => f.vod_name === currentVod.vod_name);
            if (favIdx !== -1) {
                favs[favIdx].last_ep_name = currentEpName;
                favs[favIdx].last_playback_time = currentTime;
                favs[favIdx].last_update = Date.now();
                localStorage.setItem('tvbox_favorites', JSON.stringify(favs));
            }

            let hist = getWatchHistory();
            let histIdx = hist.findIndex(h => h.vod_name === currentVod.vod_name);
            if (histIdx !== -1) {
                hist[histIdx].ep_name = currentEpName;
                hist[histIdx].playback_time = currentTime;
                hist[histIdx].time = Date.now();
                localStorage.setItem('tvbox_history', JSON.stringify(hist));
            }
        }

        // ==========================================
        // 觀看紀錄：記錄並標註「來源影視站名稱」
        // ==========================================
        function getWatchHistory() {
            try { return JSON.parse(localStorage.getItem('tvbox_history') || '[]'); } catch (e) { return []; }
        }

        function getCurrentSiteName() {
            const siteSelect = document.getElementById('site-select');
            if (siteSelect && siteSelect.selectedIndex >= 0) {
                return siteSelect.options[siteSelect.selectedIndex].textContent.replace(/\(爬蟲\)/g, '').trim();
            }
            return '精選站點';
        }

        function saveWatchHistory(vod, epName, streamUrl, playbackTime = 0) {
            if (!vod || !vod.vod_name) return;
            let list = getWatchHistory();
            list = list.filter(item => item.vod_name !== vod.vod_name);
            
            const siteApi = document.getElementById('site-select').value;
            const siteName = getCurrentSiteName();

            list.unshift({
                vod_id: vod.vod_id,
                vod_name: vod.vod_name,
                vod_pic: vod.vod_pic,
                vod_play_url: vod.vod_play_url,
                ep_name: epName,
                stream_url: streamUrl,
                playback_time: playbackTime,
                site_api: siteApi,
                site_name: siteName,
                time: Date.now()
            });

            if (list.length > 25) list = list.slice(0, 25);
            localStorage.setItem('tvbox_history', JSON.stringify(list));
            renderHistoryUI();
        }

        function renderHistoryUI() {
            const historySec = document.getElementById('history-section');
            const historyScroll = document.getElementById('history-scroll');
            const list = getWatchHistory();

            if (list.length === 0) {
                historySec.style.display = 'none';
                return;
            }

            historySec.style.display = 'block';
            historyScroll.innerHTML = '';

            list.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'history-card';
                const progressText = formatProgressChinese(item.playback_time || 0, item.ep_name);
                const siteLabel = item.site_name || '站點';

                card.innerHTML = `
                    <div class="history-site-tag" title="來源：${siteLabel}">${siteLabel}</div>
                    <button class="history-del-btn" title="刪除此紀錄" onclick="deleteHistoryItem(event, ${idx})">✕</button>
                    <div class="history-thumb-wrap">
                        <img class="history-thumb" src="${item.vod_pic || ''}" onerror="this.src='https://placehold.co/185x105?text=No+Cover'" />
                        <span class="history-ep-tag" title="${progressText}">${progressText}</span>
                    </div>
                    <div class="history-info">
                        <div class="history-name" title="${item.vod_name}">${item.vod_name}</div>
                    </div>
                `;

                card.onclick = () => {
                    const siteSelect = document.getElementById('site-select');
                    if (item.site_api && siteSelect.value !== item.site_api) {
                        siteSelect.value = item.site_api;
                    }
                    renderEpisodes(item, item.ep_name, item.playback_time || 0);
                };

                historyScroll.appendChild(card);
            });
        }

        function deleteHistoryItem(event, index) {
            event.stopPropagation();
            let list = getWatchHistory();
            list.splice(index, 1);
            localStorage.setItem('tvbox_history', JSON.stringify(list));
            renderHistoryUI();
        }

        function clearAllHistory() {
            if (!confirm('確定要清空所有觀看紀錄嗎？')) return;
            localStorage.removeItem('tvbox_history');
            renderHistoryUI();
        }

        function getFavorites() {
            try { return JSON.parse(localStorage.getItem('tvbox_favorites') || '[]'); } catch (e) { return []; }
        }

        function isFavorite(vodName) {
            return getFavorites().some(item => item.vod_name === vodName);
        }

        function updateFavCountBadge() {
            const list = getFavorites();
            favCountSpan.textContent = list.length;

        function removeFavoriteByName(event, vodName) {
            event.stopPropagation();
            let list = getFavorites();
            list = list.filter(item => item.vod_name !== vodName);
            localStorage.setItem('tvbox_favorites', JSON.stringify(list));

            updateFavBtnUI();

                renderFavoritesGrid();

        function toggleCurrentFavorite() {
            if (!currentVod) return;
            let list = getFavorites();
            const exists = list.some(item => item.vod_name === currentVod.vod_name);

            if (exists) {
                list = list.filter(item => item.vod_name !== currentVod.vod_name);
            } else {
                list.unshift({
                    vod_id: currentVod.vod_id,
                    vod_name: currentVod.vod_name,
                    vod_pic: currentVod.vod_pic,
                    vod_remarks: currentVod.vod_remarks,
                    vod_play_url: currentVod.vod_play_url,
                    site_api: document.getElementById('site-select').value,
                    site_name: getCurrentSiteName(),
                    last_ep_name: currentEpName,
                    last_playback_time: video.currentTime || 0,
                    last_update: Date.now()
                });
            }

            localStorage.setItem('tvbox_favorites', JSON.stringify(list));
            updateFavBtnUI();
            updateFavCountBadge();

            if (isShowingFavList) {
                renderFavoritesGrid();
            }
        }

        function updateFavBtnUI() {
            if (!currentVod) {
                favToggleBtn.style.display = 'none';
                return;
            }
            favToggleBtn.style.display = 'inline-flex';
            if (isFavorite(currentVod.vod_name)) {
                favToggleBtn.textContent = '★ 已在最愛';
                favToggleBtn.classList.add('active');
            } else {
                favToggleBtn.textContent = '☆ 加入最愛';
                favToggleBtn.classList.remove('active');

        function showFavoritesTab(btn) {
            isShowingFavList = true;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderFavoritesGrid();
        }

        function renderFavoritesGrid() {
            const grid = document.getElementById('movie-grid');
            const list = getFavorites();
            document.getElementById('pagination').style.display = 'none';

            if (list.length === 0) {
                grid.innerHTML = '<div style="color:#aaa; padding: 25px; text-align:center;">目前尚無任何收藏影片！<br>在觀看影片時點選「選集列表」旁邊的「☆ 加入最愛」即可收藏。</div>';
                return;
            }

            grid.innerHTML = '';
            list.forEach(vod => {
                const card = document.createElement('div');
                card.className = 'movie-card';

                let progressTagHtml = '';
                if (vod.last_playback_time || vod.last_ep_name) {
                    const tagText = formatProgressChinese(vod.last_playback_time || 0, vod.last_ep_name);
                    progressTagHtml = `<div class="card-progress-tag">${tagText}</div>`;
                }

                card.innerHTML = `
                    <div class="card-star-btn" title="點擊取消收藏" onclick="removeFavoriteByName(event, '${vod.vod_name.replace(/'/g, "\'")}')">★</div>
                    <div class="movie-note">${vod.vod_remarks || '已收藏'}</div>
                    <img src="${vod.vod_pic || ''}" onerror="this.src='https://placehold.co/140x195?text=No+Cover'" />
                    ${progressTagHtml}
                    <div class="movie-name" title="${vod.vod_name}">${vod.vod_name}</div>
                `;

                card.onclick = () => {
                    const siteSelect = document.getElementById('site-select');
                    if (vod.site_api && siteSelect.value !== vod.site_api) {
                        siteSelect.value = vod.site_api;
                    }
                    renderEpisodes(vod, vod.last_ep_name || '', vod.last_playback_time || 0);
                };
                grid.appendChild(card);
            });

        function renderCategoryButtons(classes) {
            if (!Array.isArray(classes) || classes.length === 0) return;
            currentLoadedClasses = classes;

            const container = document.getElementById('site-dynamic-categories');
            container.innerHTML = '';

            const seen = new Set();
            classes.forEach(c => {
                if (!c.type_name || seen.has(c.type_name)) return;
                seen.add(c.type_name);

                const btn = document.createElement('button');
                btn.className = `cat-btn ${currentTypeId == c.type_id && !isShowingFavList ? 'active' : ''}`;
                btn.textContent = c.type_name;
                btn.onclick = () => changeCategory(c.type_id, btn);
                container.appendChild(btn);
            });
        }

        async function fetchSiteCategories(api) {
            try {
                const res = await fetch(`/api/cms/list?api=${encodeURIComponent(api)}&ac=list`);
                const data = await res.json();
                if (data.class && Array.isArray(data.class) && data.class.length > 0) {
                    renderCategoryButtons(data.class);
                }
            } catch (e) {
                console.log('無法直接拉取分類清單，改由影片資料提煉');
            }
        }

        function changeCategory(typeId, btn) {
            isShowingFavList = false;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentTypeId = typeId;
            currentSearchWord = '';
            currentPage = 1;
            fetchVideos();
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderHistoryUI();
            updateFavCountBadge();
            const cachedContent = localStorage.getItem('tvbox_cached_config');
            if (cachedContent) {
                parseAndApplyConfig(cachedContent, true);
            }
        });

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                const rawContent = e.target.result;
                localStorage.setItem('tvbox_cached_config', rawContent);
                parseAndApplyConfig(rawContent, false);
            };
            reader.readAsText(file);
        }

        async function parseAndApplyConfig(rawContent, isAutoInit = false) {
            try {
                const res = await fetch('/api/parse-custom-config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rawContent: rawContent })
                });
                const data = await res.json();
                const lineSelect = document.getElementById('line-select');
                lineSelect.innerHTML = '';

                if (Array.isArray(data.sites) && data.sites.length > 0) {
                    localPresetSites = data.sites;
                }

                if (data.type === 'urls') {
                    if (localPresetSites.length > 0) {
                        const optLocal = document.createElement('option');
                        optLocal.value = 'local_preset';
                        optLocal.textContent = '🌟 本機直鏈站點 (精選8站)';
                        lineSelect.appendChild(optLocal);
                    }

                    let defaultIndex = 0;
                    data.list.forEach((item, idx) => {
                        const opt = document.createElement('option');
                        opt.value = item.url;
                        opt.textContent = item.name;
                        if (item.name && item.name.includes('菜妮丝')) {
                            defaultIndex = localPresetSites.length > 0 ? idx + 1 : idx;
                        }
                        lineSelect.appendChild(opt);
                    });
                    lineSelect.selectedIndex = defaultIndex;
                    await parseSelectedLine(isAutoInit);
                } else if (data.type === 'sites') {
                    lineSelect.innerHTML = `<option value="local_preset">🌟 本機直鏈站點</option>`;
                    renderSites(data.list);
                } else {
                    if (!isAutoInit) alert('無法辨識該檔案的結構');
                }
            } catch (err) {
                if (!isAutoInit) alert(`解析自訂檔案失敗: ${err.message}`);
            }
        }

        async function parseSelectedLine(isAutoInit = false) {
            const url = document.getElementById('line-select').value;
            const siteSelect = document.getElementById('site-select');
            if (!url) return;

            if (url === 'local_preset') {
                renderSites(localPresetSites);
                return;
            }

            siteSelect.innerHTML = '<option>解析站點中...</option>';

            try {
                const res = await fetch(`/api/fetch-config?url=${encodeURIComponent(url)}`);
                const data = await res.json();

                let validSites = (data.sites || []).filter(s => {
                    if (!s || !s.api || typeof s.api !== 'string') return false;
                    if (s.type === 3 && !s.api.startsWith('http')) return false;
                    return s.api.startsWith('http');
                });

                if (validSites.length === 0 && localPresetSites.length > 0) {
                    renderSites(localPresetSites);
                    return;
                }

                if (data.errorMsg && !isAutoInit && validSites.length === 0) {
                    alert(`【線路提示】${data.errorMsg}`);
                }

                renderSites(validSites);
            } catch (err) {
                if (localPresetSites.length > 0) {
                    renderSites(localPresetSites);
                } else {
                    siteSelect.innerHTML = `<option value="">解析錯誤: ${err.message}</option>`;
                }
            }
        }

        function renderSites(sites) {
            const siteSelect = document.getElementById('site-select');
            const validSites = (sites || []).filter(s => {
                if (!s || !s.api || typeof s.api !== 'string') return false;
                if (s.type === 3 && !s.api.startsWith('http')) return false;
                return s.api.startsWith('http');
            });

            siteSelect.innerHTML = '';
            if (validSites.length === 0) {
                siteSelect.innerHTML = '<option value="">該線路無任何標準 CMS 站點</option>';
                return;
            }

            let defaultSiteIndex = 0;
            validSites.forEach((s, idx) => {
                const opt = document.createElement('option');
                opt.value = s.api;
                opt.textContent = `${s.name} ${s.type === 3 ? '(爬蟲)' : ''}`;
                if (s.name && s.name.includes('非凡')) {
                    defaultSiteIndex = idx;
                }
                siteSelect.appendChild(opt);
            });

            siteSelect.selectedIndex = defaultSiteIndex;
            onSiteChange();
        }

        function onSiteChange() {
            currentPage = 1;
            currentTypeId = '';
            currentSearchWord = '';
            isShowingFavList = false;
            currentLoadedClasses = [];

            document.getElementById('site-dynamic-categories').innerHTML = '';
            
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            const allBtn = document.getElementById('btn-cat-all');
            if (allBtn) allBtn.classList.add('active');

            const api = document.getElementById('site-select').value;
            if (api) {
                fetchSiteCategories(api);
            }

            document.getElementById('search-input').value = '';
            fetchVideos();
        }

        async function doSearch() {
            let rawWord = document.getElementById('search-input').value.trim();
            if (!rawWord) return alert('請輸入搜尋關鍵字');

            if (converter) {
                currentSearchWord = await converter(rawWord);
            } else {
                currentSearchWord = rawWord;
            }

            isShowingFavList = false;
            currentTypeId = '';
            currentPage = 1;
            fetchVideos();
        }

        function changePage(delta) {
            if (currentPage + delta < 1) return;
            currentPage += delta;
            fetchVideos();
            window.scrollTo({ top: 400, behavior: 'smooth' });
        }

        async function fetchVideos() {
            const api = document.getElementById('site-select').value;
            if (!api) return;

            const grid = document.getElementById('movie-grid');
            grid.innerHTML = '<div style="color:#aaa;">正在載入片庫中...</div>';

            let query = `api=${encodeURIComponent(api)}&pg=${currentPage}`;
            if (currentTypeId) query += `&t=${encodeURIComponent(currentTypeId)}`;
            if (currentSearchWord) query += `&wd=${encodeURIComponent(currentSearchWord)}`;

            try {
                const res = await fetch(`/api/cms/list?${query}`);
                const data = await res.json();
                
                if (data.class && Array.isArray(data.class) && data.class.length > 0) {
                    renderCategoryButtons(data.class);
                } else if (currentLoadedClasses.length === 0 && data.list && Array.isArray(data.list) && data.list.length > 0) {
                    const extracted = [];
                    data.list.forEach(item => {
                        if (item.type_id && item.type_name) {
                            extracted.push({ type_id: item.type_id, type_name: item.type_name });
                        }
                    });
                    if (extracted.length > 0) {
                        renderCategoryButtons(extracted);
                    }
                }

                const list = data.list || [];
                if (list.length === 0) {
                    grid.innerHTML = `查無相關影片。`;
                    document.getElementById('pagination').style.display = 'none';
                    return;
                }

                grid.innerHTML = '';
                list.forEach(vod => {
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.innerHTML = `
                        <div class="movie-note">${vod.vod_remarks || ''}</div>
                        <img src="${vod.vod_pic || ''}" onerror="this.src='https://placehold.co/140x195?text=No+Cover'" />
                        <div class="movie-name" title="${vod.vod_name}">${vod.vod_name}</div>
                    `;
                    card.onclick = () => renderEpisodes(vod);
                    grid.appendChild(card);
                });

                document.getElementById('pagination').style.display = 'flex';
                document.getElementById('page-indicator').textContent = `第 ${currentPage} 頁`;

            } catch (err) {
                grid.innerHTML = `<span style="color:red">載入失敗: ${err.message}</span>`;
            }
        }

        // ==========================================
        // 解析多個播放源線路 (徹底解決單一線路死循環問題)
        // ==========================================
        function parseAllServers(playUrls) {
            if (!playUrls) return [];
            const rawServers = playUrls.split('$$$');
            const result = [];
            let i = 0;

            while (i < rawServers.length) {
                const s = rawServers[i].trim();
                if (!s) { i++; continue; }

                let serverName = '';
                let epStr = '';

                if (!s.includes('$') && i + 1 < rawServers.length && rawServers[i + 1].includes('$')) {
                    serverName = s;
                    epStr = rawServers[i + 1];
                    i += 2;
                } else {
                    serverName = `線路 ${result.length + 1}`;
                    epStr = s;
                    i += 1;
                }

                const episodes = [];
                epStr.split('#').forEach(item => {
                    item = item.trim();
                    if (!item) return;
                    const parts = item.split('$');
                    if (parts.length >= 2) {
                        episodes.push({ name: parts[0].trim(), url: parts[1].trim() });
                    } else if (parts[0].startsWith('http')) {
                        episodes.push({ name: '播放', url: parts[0].trim() });
                    }
                });

                if (episodes.length > 0) {
                    result.push({ name: serverName, episodes: episodes });
                }
            }
            return result;
        }

        function renderEpisodes(vod, targetEpName = '', startTime = 0) {
            currentVod = vod;
            updateFavBtnUI();
            updateOpEdUI();
            closeSpeedOverlay();
            clearBufferingTimer();
            autoSwitchAttemptCount = 0;

            updatePlayingTitle(vod.vod_name);

            currentServerList = parseAllServers(vod.vod_play_url || '');
            currentServerIndex = 0;

            if (currentServerList.length === 0) {
                document.getElementById('episodes-grid').innerHTML = '無可用播放鏈接';
                serverTabs.style.display = 'none';
                return;
            }

            // 渲染多播放線路標籤列
            if (currentServerList.length > 1) {
                serverTabs.style.display = 'flex';
                serverTabs.innerHTML = '';
                currentServerList.forEach((srv, sIdx) => {
                    const sBtn = document.createElement('button');
                    sBtn.className = `server-btn ${sIdx === 0 ? 'active' : ''}`;
                    sBtn.textContent = `📡 ${srv.name}`;
                    sBtn.onclick = () => switchServer(sIdx, currentEpName, video.currentTime || startTime);
                    serverTabs.appendChild(sBtn);
                });
            } else {
                serverTabs.style.display = 'none';
            }

            renderCurrentServerEpisodes(targetEpName, startTime);
        }

        function switchServer(newIdx, targetEpName = '', resumeSec = 0) {
            if (newIdx < 0 || newIdx >= currentServerList.length) return;
            currentServerIndex = newIdx;

            const allServerBtns = document.querySelectorAll('.server-btn');
            allServerBtns.forEach((b, i) => {
                b.classList.toggle('active', i === newIdx);
            });

            closeSpeedOverlay();
            renderCurrentServerEpisodes(targetEpName, resumeSec);
        }

        function renderCurrentServerEpisodes(targetEpName = '', startTime = 0) {
            const epContainer = document.getElementById('episodes-grid');
            epContainer.innerHTML = '';

            const currentSrv = currentServerList[currentServerIndex] || currentServerList[0];
            const epList = currentSrv.episodes;

            let defaultPlayIndex = 0;
            if (targetEpName) {
                const foundIdx = epList.findIndex(e => e.name === targetEpName);
                if (foundIdx !== -1) defaultPlayIndex = foundIdx;
            }

            epList.forEach((ep, index) => {
                const btn = document.createElement('button');
                btn.className = 'ep-btn';
                btn.textContent = ep.name;
                btn.onclick = () => {
                    document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentEpName = ep.name;
                    currentStreamUrl = ep.url;
                    
                    const resumeSec = (index === defaultPlayIndex && startTime > 0) ? startTime : 0;
                    playStream(ep.url, `${currentVod.vod_name} - ${ep.name}`, resumeSec);
                    saveWatchHistory(currentVod, ep.name, ep.url, resumeSec);
                };
                epContainer.appendChild(btn);

                if (index === defaultPlayIndex) {
                    btn.click();
                }
            });
        }

        // ==========================================
        // 核心播放控制與「零手動」全自動換源機制
        // ==========================================
        function playStream(rawUrl, title, startTime = 0) {
            isTriggeringNext = false;
            clearBufferingTimer();
            updateOpEdUI();
            updatePlayingTitle(`準備載入：${title}`);
            closeSpeedOverlay();

            const proxiedUrl = `/api/proxy-m3u8?url=${encodeURIComponent(rawUrl)}`;

            const rule = getCurrentOpEd();
            let targetStart = 0;
            let toastMsg = '';
            if (startTime > 0) {
                targetStart = startTime;
                toastMsg = `▶ 已自動接續至：${formatProgressChinese(startTime)}`;
            } else if (rule && rule.op > 0) {
                targetStart = rule.op;
                toastMsg = `⏭ 已為全劇自動跳過片頭至：${formatTime(rule.op)}`;
            }

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            let hasFallenBackToRaw = false;

            const applyStartTime = () => {
                if (targetStart > 0) {
                    video.currentTime = targetStart;
                    skipToast.textContent = toastMsg;
                    skipToast.style.display = 'block';
                    setTimeout(() => { skipToast.style.display = 'none'; }, 2500);
                }
            };

            if (Hls.isSupported()) {
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    fragLoadingTimeOut: 20000
                });
                
                hlsInstance.loadSource(proxiedUrl);
                hlsInstance.attachMedia(video);

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    updatePlayingTitle(`正在播放：${title}`);
                    video.play().then(() => {
                        playBtn.textContent = '❚❚';
                        applyStartTime();
                    }).catch(e => console.log('等待點擊播放', e));
                    updateVolumeUI();
                });

                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        if (!hasFallenBackToRaw && (!video.currentTime || video.currentTime < 2)) {
                            hasFallenBackToRaw = true;
                            console.log('代理載入失敗，切換直鏈播放');
                            hlsInstance.loadSource(rawUrl);
                            return;
                        }

                        const savedTime = (video && video.currentTime > 1) ? Math.floor(video.currentTime) : targetStart;
                        console.warn(`[播放中斷救援] 在 ${savedTime} 秒遇到致命錯誤:`, data.type);

                        if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                            hlsInstance.recoverMediaError();
                        } else if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                            hlsInstance.startLoad();
                        } else {
                            // 觸發全自動智能換源
                            triggerAutoFailover(savedTime, '連線嚴重中斷');
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = proxiedUrl;
                video.addEventListener('loadedmetadata', function onMeta() {
                    applyStartTime();
                    video.removeEventListener('loadedmetadata', onMeta);
                });
                video.play();
                updateVolumeUI();
            }
        }

        // ==========================================
        // 全自動故障轉移 (Failover)：卡頓中斷時自動接續下一個源
        // ==========================================
        function triggerAutoFailover(savedTime = 0, reason = '連線異常') {
            clearBufferingTimer();

            // 1. 如果本片只有單一源，絕不無效亂跳，直接原地自動重連
            if (!currentServerList || currentServerList.length <= 1) {
                console.log('[單一訊號源] 執行原地自動重連...');
                skipToast.textContent = `⚠️ ${reason}，正在原地重新連線...`;
                skipToast.style.display = 'block';
                setTimeout(() => { skipToast.style.display = 'none'; }, 2200);

                if (autoSwitchAttemptCount >= 2) {
                    // 原地重試 2 次依然連不上，跳出居中保底按鈕
                    showConnectionErrorOverlay(savedTime);
                    return;
                }
                autoSwitchAttemptCount++;
                playStream(currentStreamUrl, `${currentVod.vod_name} - ${currentEpName}`, savedTime);
                return;
            }

            // 2. 如果具備多個源，檢查是否所有源皆已輪詢嘗試過（防死循環）
            if (autoSwitchAttemptCount >= currentServerList.length) {
                console.warn('[所有訊號源輪詢完畢] 暫停自動切換，等待手動重試');
                showConnectionErrorOverlay(savedTime);
                return;
            }

            // 3. 全自動切換至下一個訊號源，全程免手動點擊
            autoSwitchAttemptCount++;
            const nextIdx = (currentServerIndex + 1) % currentServerList.length;
            const targetServer = currentServerList[nextIdx];

            skipToast.textContent = `⚡ ${reason}，已自動切換至【${targetServer.name}】(接續 ${formatTime(savedTime)})`;
            skipToast.style.display = 'block';
            setTimeout(() => { skipToast.style.display = 'none'; }, 2800);

            switchServer(nextIdx, currentEpName, savedTime);
        }

        // 所有源皆失效時的居中保底浮層
        function showConnectionErrorOverlay(savedTime = 0) {
            const hasMultipleServers = currentServerList.length > 1;
            
            if (hasMultipleServers) {
                speedOverlayVal.textContent = '⚠️ 所有線路皆暫時不順';
                speedOverlayHint.textContent = '已為您輪流嘗試所有線路，請點擊重試連線';
                speedBtnAction.textContent = '🔄 重新輪詢所有線路';
                speedBtnAction.dataset.action = 'retry_all';
                speedBtnAction.dataset.resumeTime = savedTime;
            } else {
                speedOverlayVal.textContent = '⚠️ 訊號線路暫時中斷';
                speedOverlayHint.textContent = '此影片僅有單一線路，請點擊重新連線';
                speedBtnAction.textContent = '🔄 重新整理線路';
                speedBtnAction.dataset.action = 'retry_single';
                speedBtnAction.dataset.resumeTime = savedTime;
            }

            speedOverlay.classList.add('show');
        }

        function handleSpeedOverlayAction(event) {
            event.stopPropagation();
            const action = speedBtnAction.dataset.action;
            const resumeTime = parseFloat(speedBtnAction.dataset.resumeTime || 0);

            autoSwitchAttemptCount = 0;
            closeSpeedOverlay();

            if (action === 'retry_all') {
                const nextIdx = (currentServerIndex + 1) % currentServerList.length;
                switchServer(nextIdx, currentEpName, resumeTime);
            } else {
                playStream(currentStreamUrl, `${currentVod.vod_name} - ${currentEpName}`, resumeTime);
            }
        }

        function closeSpeedOverlay(event) {
            if (event) event.stopPropagation();
            speedOverlay.classList.remove('show');
        }

        // ==========================================
        // 全劇片頭 / 片尾記憶規則管理
        // ==========================================
        let isTriggeringNext = false;

        function getOpEdRules() {
            try { return JSON.parse(localStorage.getItem('tvbox_op_ed_rules') || '{}'); } catch(e) { return {}; }
        }

        function saveOpEdRules(rules) {
            localStorage.setItem('tvbox_op_ed_rules', JSON.stringify(rules));
        }

        function getCurrentOpEd() {
            if (!currentVod || !currentVod.vod_name) return null;
            const rules = getOpEdRules();
            return rules[currentVod.vod_name] || null;
        }

        function updateOpEdUI() {
            const wrap = document.getElementById('op-ed-wrap');
            const btnOp = document.getElementById('btn-set-op');
            const btnEd = document.getElementById('btn-set-ed');
            if (!currentVod || !currentVod.vod_name) {
                if (wrap) wrap.style.display = 'none';
                return;
            }
            if (wrap) wrap.style.display = 'flex';

            const rule = getCurrentOpEd();
            if (rule && rule.op > 0) {
                btnOp.textContent = `⏭ 片頭 ${formatTime(rule.op)} (點擊取消)`;
                btnOp.classList.add('active');
            } else {
                btnOp.textContent = `⏭ 記住片頭`;
                btnOp.classList.remove('active');
            }

            if (rule && rule.edTail > 0) {
                btnEd.textContent = `⏮ 片尾 倒數${formatTime(rule.edTail)} (點擊取消)`;
                btnEd.classList.add('active');
            } else {
                btnEd.textContent = `⏮ 記住片尾`;
                btnEd.classList.remove('active');
            }
        }

        function toggleSetOp() {
            resetControlsTimer();
            if (!currentVod || !currentVod.vod_name) return;
            const rules = getOpEdRules();
            const name = currentVod.vod_name;
            const current = rules[name] || {};

            if (current.op > 0) {
                delete current.op;
                skipToast.textContent = `❌ 已取消《${name}》全劇片頭跳過`;
            } else {
                const t = Math.floor(video.currentTime || 0);
                if (t <= 5) return alert('請播放到片頭結束的位置再點擊記錄');
                current.op = t;
                skipToast.textContent = `✅ 已記住《${name}》片頭 (${formatTime(t)})，所有集數開始時將自動跳過`;
            }

            rules[name] = current;
            saveOpEdRules(rules);
            updateOpEdUI();
            skipToast.style.display = 'block';
            setTimeout(() => { skipToast.style.display = 'none'; }, 2800);
        }

        function toggleSetEd() {
            resetControlsTimer();
            if (!currentVod || !currentVod.vod_name || !video.duration) return;
            const rules = getOpEdRules();
            const name = currentVod.vod_name;
            const current = rules[name] || {};

            if (current.edTail > 0) {
                delete current.edTail;
                skipToast.textContent = `❌ 已取消《${name}》全劇片尾跳過`;
            } else {
                const remain = Math.floor(video.duration - video.currentTime);
                if (remain <= 5 || remain >= video.duration - 30) return alert('請播放到片尾曲即將開始的位置再點擊記錄');
                current.edTail = remain;
                skipToast.textContent = `✅ 已記住《${name}》片尾 (倒數 ${formatTime(remain)})，所有集數到此處將自動換集`;
            }

            rules[name] = current;
            saveOpEdRules(rules);
            updateOpEdUI();
            skipToast.style.display = 'block';
            setTimeout(() => { skipToast.style.display = 'none'; }, 2800);
        }

        function playNextEpisode(reason = '本集播放結束') {
            const epButtons = Array.from(document.querySelectorAll('.ep-btn'));
            const activeIdx = epButtons.findIndex(b => b.classList.contains('active'));

            if (activeIdx !== -1 && activeIdx + 1 < epButtons.length) {
                const nextBtn = epButtons[activeIdx + 1];
                skipToast.textContent = `▶ ${reason}，自動接續：${nextBtn.textContent}`;
                skipToast.style.display = 'block';

                setTimeout(() => {
                    skipToast.style.display = 'none';
                    nextBtn.click();
                }, 800);
            }
        }
    </script>
