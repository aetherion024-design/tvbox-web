<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web TVBox 影視中心</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f0f; color: #f1f1f1; margin: 0; padding: 20px; }
        .header { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; flex-wrap: wrap; background: #181818; padding: 10px 16px; border-radius: 8px; }
        select, input, button { padding: 8px 12px; border-radius: 6px; border: 1px solid #333; background: #222; color: #fff; font-size: 14px; }
        button { cursor: pointer; background: #2a2a2a; border: 1px solid #444; font-weight: 500; transition: background 0.2s; }
        button:hover { background: #383838; }
        .btn-upload { background: #005533; border-color: #008855; color: #fff; font-weight: bold; }
        .btn-upload:hover { background: #007744; }
        
        .search-box { display: flex; gap: 8px; margin-left: auto; }
        .search-box input { width: 220px; background: #121212; border: 1px solid #3a3a3a; }
        
        .ad-switch-box { display: flex; align-items: center; gap: 8px; margin-left: 10px; font-size: 13px; color: #00ff88; background: #1e2a22; padding: 6px 12px; border-radius: 6px; border: 1px solid #235534; }
        .ad-switch-box input[type="checkbox"] { cursor: pointer; width: 16px; height: 16px; accent-color: #00cc66; }

        .main-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }
        
        .player-box { background: #000; border-radius: 8px; overflow: hidden; position: relative; user-select: none; }
        .player-box:fullscreen { width: 100vw !important; height: 100vh !important; border-radius: 0; }
        .player-box:-webkit-full-screen { width: 100vw !important; height: 100vh !important; border-radius: 0; }
        
        .player-box.hide-cursor { cursor: none !important; }
        .player-box.hide-cursor * { cursor: none !important; }
        
        video { width: 100%; height: 440px; background: #000; display: block; cursor: pointer; }
        video.v-hidden { display: none !important; }
        .player-box:fullscreen video { height: 100vh !important; }
        .player-box:-webkit-full-screen video { height: 100vh !important; }
        
        .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(transparent, rgba(0,0,0,0.92));
            display: flex;
            flex-direction: column;
            padding: 10px 18px 12px;
            gap: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-in-out;
            z-index: 1000;
        }

        .custom-controls.show { opacity: 1; pointer-events: auto; }

        .progress-bar-wrap { width: 100%; height: 6px; background: rgba(255,255,255,0.25); border-radius: 3px; cursor: pointer; position: relative; transition: height 0.15s; }
        .progress-bar-wrap:hover { height: 8px; }
        .progress-bar-fill { height: 100%; background: #e50914; border-radius: 3px; width: 0%; pointer-events: none; }

        .controls-row { display: flex; align-items: center; justify-content: space-between; }
        .controls-left, .controls-right { display: flex; align-items: center; gap: 14px; }
        .ctrl-btn { background: none; border: none; color: #fff; cursor: pointer; font-size: 16px; padding: 4px 6px; display: flex; align-items: center; justify-content: center; }
        .ctrl-btn:hover { color: #e50914; }
        .time-display { font-size: 13px; color: #ddd; font-family: monospace; user-select: none; }

        .volume-box { display: flex; align-items: center; gap: 8px; }
        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 5px;
            background: #555;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
            margin: 0;
            padding: 0;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 4px rgba(0,0,0,0.6);
            transition: transform 0.1s;
        }
        .volume-slider::-webkit-slider-thumb:hover { transform: scale(1.25); background: #e50914; }
        .volume-slider::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: #fff; border: none; cursor: pointer; }

        .seek-ripple {
            position: absolute;
            top: 50%;
            transform: translateY(-50%) scale(0.7);
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            padding: 16px 28px;
            border-radius: 35px;
            font-size: 16px;
            font-weight: bold;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            backdrop-filter: blur(6px);
            z-index: 2000;
        }
        .seek-ripple.active { opacity: 1; transform: translateY(-50%) scale(1.05); }
        #ripple-left { left: 12%; }
        #ripple-right { right: 12%; }

        .skip-toast {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 204, 102, 0.95);
            color: #000;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: none;
            z-index: 2000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            pointer-events: none;
        }

        .player-bottom-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #181818; border-top: 1px solid #2a2a2a; }
        .playing-title { font-size: 15px; font-weight: bold; word-break: break-all; }
        .op-ed-wrap { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .skip-btn {
            background: #252525;
            border: 1px solid #444;
            color: #ccc;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .skip-btn:hover { background: #333; color: #fff; }
        .skip-btn.active {
            background: #193322;
            border-color: #00cc66;
            color: #00ff88;
            font-weight: bold;
        }

        .episodes-box { background: #181818; border-radius: 8px; padding: 15px; max-height: 490px; overflow-y: auto; }
        .episodes-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .episodes-title { font-weight: bold; font-size: 15px; }
        .fav-btn {
            background: #252525;
            border: 1px solid #444;
            color: #bbb;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .fav-btn:hover { background: #333; border-color: #666; }
        .fav-btn.active { color: #ffbb00; border-color: #ffaa00; background: #2f2717; font-weight: bold; }

        .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; }
        .ep-btn { padding: 8px 5px; font-size: 12px; background: #222; border: 1px solid #333; color: #bbb; text-align: center; border-radius: 4px; cursor: pointer; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .ep-btn:hover { background: #333; color: #fff; }
        .ep-btn.active { background: #cc0000; border-color: #cc0000; color: #fff; font-weight: bold; }

        .history-section { background: #181818; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; }
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .history-title { font-size: 14px; font-weight: bold; color: #00cc66; display: flex; align-items: center; gap: 6px; }
        .history-clear-btn { background: transparent; border: none; color: #888; font-size: 12px; cursor: pointer; padding: 2px 6px; }
        .history-clear-btn:hover { color: #ff4444; }
        .history-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; scroll-behavior: smooth; }
        .history-scroll::-webkit-scrollbar { height: 6px; }
        .history-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        
        .history-card {
            flex: 0 0 120px;
            background: #222;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            border: 1px solid #333;
            transition: transform 0.15s, border-color 0.15s;
        }
        .history-card:hover { transform: translateY(-3px); border-color: #00cc66; }
        .history-thumb-wrap { width: 100%; height: 168px; position: relative; background: #111; }
        .history-thumb { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
        .history-ep-tag { position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.85); color: #00ff88; font-size: 10px; padding: 2px 6px; border-radius: 3px; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow:
