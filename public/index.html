        async function parseAndApplyConfig(rawContent, isAutoInit = false) {
            try {
                const res = await fetch('/api/parse-custom-config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rawContent: rawContent })
                });
                const data = await res.json();
                const lineSelect = document.getElementById('line-select');
                lineSelect.innerHTML = '';

                if (Array.isArray(data.sites) && data.sites.length > 0) {
                    localPresetSites = data.sites;
                }

                if (data.type === 'urls') {
                    if (localPresetSites.length > 0) {
                        const optLocal = document.createElement('option');
                        optLocal.value = 'local_preset';
                        optLocal.textContent = '🌟 本機直鏈站點 (精選8站)';
                        lineSelect.appendChild(optLocal);
                    }

                    let defaultIndex = 0;
                    data.list.forEach((item, idx) => {
                        const opt = document.createElement('option');
                        opt.value = item.url;
                        opt.textContent = item.name;
                        if (item.name && item.name.includes('菜妮丝')) {
                            defaultIndex = localPresetSites.length > 0 ? idx + 1 : idx;
                        }
                        lineSelect.appendChild(opt);
                    });
                    lineSelect.selectedIndex = defaultIndex;
                    await parseSelectedLine(isAutoInit);
                } else if (data.type === 'sites') {
                    lineSelect.innerHTML = `<option value="local_preset">🌟 本機直鏈站點</option>`;
                    renderSites(data.list);
                } else {
                    if (!isAutoInit) alert('無法辨識該檔案的結構');
                }
            } catch (err) {
                if (!isAutoInit) alert(`解析自訂檔案失敗: ${err.message}`);
            }
        }

        async function parseSelectedLine(isAutoInit = false) {
            const url = document.getElementById('line-select').value;
            const siteSelect = document.getElementById('site-select');
            if (!url) return;

            if (url === 'local_preset') {
                renderSites(localPresetSites);
                return;
            }

            siteSelect.innerHTML = '<option>解析站點中...</option>';

            try {
                const res = await fetch(`/api/fetch-config?url=${encodeURIComponent(url)}`);
                const data = await res.json();

                let remoteValidSites = (data.sites || []).filter(s => {
                    if (!s || !s.api || typeof s.api !== 'string') return false;
                    if (s.type === 3 && !s.api.startsWith('http')) return false;
                    return s.api.startsWith('http');
                });

                // 動態將使用者上傳設定檔中的直鏈站點（localPresetSites）合併進線路站點清單（依 API 網址去重）
                let mergedSites = [...remoteValidSites];
                if (Array.isArray(localPresetSites) && localPresetSites.length > 0) {
                    const existingApis = new Set(mergedSites.map(s => s.api.replace(/\/$/, '')));
                    localPresetSites.forEach(localSite => {
                        if (localSite && localSite.api && localSite.api.startsWith('http')) {
                            const normApi = localSite.api.replace(/\/$/, '');
                            if (!existingApis.has(normApi)) {
                                mergedSites.push(localSite);
                                existingApis.add(normApi);
                            }
                        }
                    });
                }

                if (data.errorMsg && !isAutoInit && mergedSites.length === 0) {
                    alert(`【線路提示】${data.errorMsg}`);
                }

                renderSites(mergedSites);
            } catch (err) {
                if (localPresetSites.length > 0) {
                    renderSites(localPresetSites);
                } else {
                    siteSelect.innerHTML = `<option value="">解析錯誤: ${err.message}</option>`;
                }
            }
        }

        function renderSites(sites) {
            const siteSelect = document.getElementById('site-select');
            const validSites = (sites || []).filter(s => {
                if (!s || !s.api || typeof s.api !== 'string') return false;
                if (s.type === 3 && !s.api.startsWith('http')) return false;
                return s.api.startsWith('http');
            });

            siteSelect.innerHTML = '';
            if (validSites.length === 0) {
                siteSelect.innerHTML = '<option value="">該線路無任何標準 CMS 站點</option>';
                return;
            }

            let defaultSiteIndex = 0;
            validSites.forEach((s, idx) => {
                const opt = document.createElement('option');
                opt.value = s.api;
                opt.textContent = `${s.name} ${s.type === 3 ? '(爬蟲)' : ''}`;
                if (s.name && s.name.includes('非凡')) {
                    defaultSiteIndex = idx;
                }
                siteSelect.appendChild(opt);
            });

            siteSelect.selectedIndex = defaultSiteIndex;
            onSiteChange();
        }

        function onSiteChange() {
            currentPage = 1;
            totalPages = 0;
            isLastPageReached = false;
            currentTypeId = '';
            currentSearchWord = '';
            currentRawSearchWord = '';
            isShowingFavList = false;
            currentLoadedClasses = [];

            document.getElementById('site-dynamic-categories').innerHTML = '';

            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            const allBtn = document.getElementById('btn-cat-all');
            if (allBtn) allBtn.classList.add('active');

            const api = document.getElementById('site-select').value;
            if (api) {
                fetchSiteCategories(api);
            }

            document.getElementById('search-input').value = '';
            toggleClearSearchBtn();
            fetchVideos();
        }

        function toggleClearSearchBtn() {
            const input = document.getElementById('search-input');
            const btn = document.getElementById('clear-search-btn');
            if (input && btn) {
                if (input.value.trim().length > 0) {
                    btn.classList.add('visible');
                } else {
                    btn.classList.remove('visible');
                }
            }
        }

        function clearSearchInput() {
            const input = document.getElementById('search-input');
            if (!input) return;
            input.value = '';
            toggleClearSearchBtn();
            input.focus();
            if (currentSearchWord || currentRawSearchWord) {
                currentSearchWord = '';
                currentRawSearchWord = '';
                currentPage = 1;
                totalPages = 0;
                isLastPageReached = false;
                fetchVideos(false);
            }
        }

        async function doSearch() {
            let rawWord = document.getElementById('search-input').value.trim();
            if (!rawWord) return alert('請輸入搜尋關鍵字');

            // 手機版搜尋時自動收起虛擬鍵盤，避免鍵盤遮擋下方搜尋結果
            document.getElementById('search-input').blur();

            currentRawSearchWord = rawWord;
            if (converter) {
                currentSearchWord = await converter(rawWord);
            } else {
                currentSearchWord = rawWord;
            }

            isShowingFavList = false;
            currentTypeId = '';
            currentPage = 1;
            totalPages = 0;
            isLastPageReached = false;
            await fetchVideos(true);
        }

        function updatePaginationUI() {
            const pagEl = document.getElementById('pagination');
            const firstBtn = document.getElementById('btn-first-page');
            const prevBtn = document.getElementById('btn-prev-page');
            const nextBtn = document.getElementById('btn-next-page');
            const indicator = document.getElementById('page-indicator');
            const endHint = document.getElementById('page-end-hint');

            if (!pagEl) return;
            pagEl.style.display = 'flex';

            if (firstBtn) firstBtn.style.display = (currentPage > 1) ? 'inline-block' : 'none';
            if (prevBtn) prevBtn.disabled = (currentPage <= 1);

            const reachedEnd = isLastPageReached || (totalPages > 0 && currentPage >= totalPages);
            if (nextBtn) nextBtn.disabled = reachedEnd;

            if (indicator) {
                indicator.textContent = (totalPages > 0)
                    ? `第 ${currentPage} / ${totalPages} 頁`
                    : `第 ${currentPage} 頁`;
            }
            if (endHint) {
                if (reachedEnd) {
                    endHint.classList.add('show');
                } else {
                    endHint.classList.remove('show');
                }
            }
        }

        function goToFirstPage() {
            if (currentPage <= 1) return;
            currentPage = 1;
            isLastPageReached = false;
            fetchVideos(false, true);
            const targetEl = document.getElementById('category-row') || document.getElementById('movie-grid');
            if (targetEl) targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function changePage(delta) {
            if (delta < 0 && currentPage <= 1) return;
            if (delta > 0 && (isLastPageReached || (totalPages > 0 && currentPage >= totalPages))) return;

            const prevPage = currentPage;
            currentPage += delta;
            if (delta < 0) isLastPageReached = false;

            fetchVideos(false, true, prevPage);
            const targetEl = document.getElementById('category-row') || document.getElementById('movie-grid');
            if (targetEl) targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        async function fetchVideos(scrollToResults = false, isPageTurn = false, fallbackPage = 1) {
            const api = document.getElementById('site-select').value;
            if (!api) return;

            const grid = document.getElementById('movie-grid');
            const prevGridHtml = grid.innerHTML;
            const prevPaginationDisplay = document.getElementById('pagination').style.display;

            // 翻頁時保留原畫面並呈現微半透明載入感，避免畫面閃白；切換分類或新搜尋才顯示載入文字
            if (isPageTurn && currentPage > 1) {
                grid.style.opacity = '0.55';
            } else {
                grid.style.opacity = '1';
                grid.innerHTML = '<div style="color:#aaa;">正在載入片庫中...</div>';
            }

            const fetchCmsPage = async (keyword) => {
                let q = `api=${encodeURIComponent(api)}&pg=${currentPage}`;
                if (currentTypeId) q += `&t=${encodeURIComponent(currentTypeId)}`;
                if (keyword) q += `&wd=${encodeURIComponent(keyword)}`;
                const r = await fetch(`/api/cms/list?${q}`);
                return await r.json();
            };

            try {
                let data = await fetchCmsPage(currentSearchWord);
                let list = data.list || [];

                // 若為搜尋狀態，啟動雙引擎別名解析：
                // 引擎 A（方案二）：本地 500+ 精選台陸譯名庫（0 毫秒秒查）
                // 引擎 B（方案一）：若本地字典未收錄，自動透過 Wikidata 線上抓出大陸正式譯名（附快取與 1.6s 超時保護）
                if (currentSearchWord && currentPage === 1) {
                    const rawInput = currentRawSearchWord || currentSearchWord;
                    let aliasList = resolveAliasKeywords(rawInput);

                    if (aliasList.length === 0) {
                        const onlineAliases = await fetchWikidataAliases(rawInput);
                        if (onlineAliases.length > 0) {
                            aliasList = onlineAliases;
                        }
                    }

                    const extraKeywords = [];
                    for (const alias of aliasList) {
                        const convAlias = converter ? await converter(alias) : alias;
                        if (convAlias && convAlias !== currentSearchWord && !extraKeywords.includes(convAlias)) {
                            extraKeywords.push(convAlias);
                        }
                    }

                    // 命中台陸譯名別名時，並發查詢別名並自動合併去重
                    if (extraKeywords.length > 0) {
                        const aliasResults = await Promise.all(extraKeywords.slice(0, 3).map(kw => fetchCmsPage(kw).catch(() => ({ list: [] }))));
                        const seenIds = new Set(list.map(v => `${v.vod_id}_${v.vod_name}`));
                        aliasResults.forEach(resData => {
                            (resData.list || []).forEach(v => {
                                const key = `${v.vod_id}_${v.vod_name}`;
                                if (!seenIds.has(key)) {
                                    list.push(v);
                                    seenIds.add(key);
                                }
                            });
                        });
                    }
                }

                grid.style.opacity = '1';

                if (data.class && Array.isArray(data.class) && data.class.length > 0) {
                    renderCategoryButtons(data.class);
                } else if (currentLoadedClasses.length === 0 && list.length > 0) {
                    const extracted = [];
                    list.forEach(item => {
                        if (item.type_id && item.type_name) {
                            extracted.push({ type_id: item.type_id, type_name: item.type_name });
                        }
                    });
                    if (extracted.length > 0) {
                        renderCategoryButtons(extracted);
                    }
                }

                const parsedPageCount = parseInt(data.pagecount || data.page_count || 0, 10);
                if (parsedPageCount > 0) {
                    totalPages = parsedPageCount;
                }

                if (list.length === 0) {
                    // 防呆機制：如果是翻到下一頁才發現沒資料（例如第9頁按下一頁到第10頁是空的），
                    // 絕不清空畫面也不隱藏分頁列，而是自動退回上一頁並鎖定「下一頁」按鈕！
                    if (isPageTurn && currentPage > 1) {
                        currentPage = fallbackPage;
                        totalPages = currentPage;
                        isLastPageReached = true;
                        grid.innerHTML = prevGridHtml;
                        document.getElementById('pagination').style.display = prevPaginationDisplay || 'flex';
                        updatePaginationUI();
                        return;
                    }

                    grid.innerHTML = `查無相關影片。`;
                    document.getElementById('pagination').style.display = 'none';
                    if (scrollToResults) {
                        setTimeout(() => {
                            const targetEl = document.getElementById('category-row') || grid;
                            targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }, 80);
                    }
                    return;
                }

                isLastPageReached = (totalPages > 0 && currentPage >= totalPages);

                grid.innerHTML = '';
                list.forEach(vod => {
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.innerHTML = `
                        <div class="movie-note">${vod.vod_remarks || ''}</div>
                        <img src="${vod.vod_pic || ''}" onerror="this.src='https://placehold.co/140x195?text=No+Cover'" />
                        <div class="movie-name" title="${vod.vod_name}">${vod.vod_name}</div>
                    `;
                    card.onclick = () => renderEpisodes(vod);
                    grid.appendChild(card);
                });

                updatePaginationUI();

                if (scrollToResults) {
                    setTimeout(() => {
                        const targetEl = document.getElementById('category-row') || grid;
                        targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 80);
                }

            } catch (err) {
                grid.style.opacity = '1';
                if (isPageTurn && currentPage > 1) {
                    currentPage = fallbackPage;
                    grid.innerHTML = prevGridHtml;
                    updatePaginationUI();
                } else {
                    grid.innerHTML = `<span style="color:red">載入失敗: ${err.message}</span>`;
                }
            }
        }

        function scrollToPlayerBox() {
            if (isFullscreenActive()) return;
            const target = document.getElementById('player-box');
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function closeAltSourcesPanel() {
            if (altSourcesPanel) altSourcesPanel.classList.remove('show');
        }

        // 僅針對「當前正在播放的這一集」的臨時已嘗試站點集合（防止無限循環；換片或換集自動重置，絕不封鎖其他影片）
        let triedEpisodeApis = new Set();
        let currentEpisodeAttemptKey = '';
        let cachedAltResultsForEpisode = null;
        let autoSwitchInProgress = false;

        function getEpisodeAttemptKey(vodName, epName) {
            return `${vodName || ''}__${epName || ''}`;
        }

        function renderEpisodes(vod, targetEpName = '', startTime = 0, preserveTriedSet = false) {
            if (!preserveTriedSet) {
                triedEpisodeApis.clear();
                cachedAltResultsForEpisode = null;
                autoSwitchInProgress = false;
            }
            scrollToPlayerBox();
            closeAltSourcesPanel();
            currentVod = vod;
            updateFavBtnUI();
            updateOpEdUI();

            updatePlayingTitle(vod.vod_name);
            const epContainer = document.getElementById('episodes-grid');
            epContainer.innerHTML = '';

            const playUrls = vod.vod_play_url || '';
            const epList = [];

            const servers = playUrls.split('$$$');
            let m3u8Group = servers.find(s => s.includes('.m3u8')) || servers[0] || '';
            const episodes = m3u8Group.split('#');

            episodes.forEach(item => {
                const parts = item.split('$');
                if (parts.length >= 2) {
                    epList.push({ name: parts[0], url: parts[1] });
                } else if (parts[0] && parts[0].startsWith('http')) {
                    epList.push({ name: '播放', url: parts[0] });
                }
            });

            if (epList.length === 0) {
                epContainer.innerHTML = '無可用播放鏈接';
                return;
            }

            let defaultPlayIndex = 0;
            if (targetEpName) {
                const foundIdx = epList.findIndex(e => e.name === targetEpName);
                if (foundIdx !== -1) defaultPlayIndex = foundIdx;
            }

            epList.forEach((ep, index) => {
                const btn = document.createElement('button');
                btn.className = 'ep-btn';
                btn.textContent = ep.name;
                btn.onclick = (ev) => {
                    document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    const nextAttemptKey = getEpisodeAttemptKey(vod.vod_name, ep.name);
                    if (ev && ev.isTrusted && currentEpisodeAttemptKey !== nextAttemptKey) {
                        triedEpisodeApis.clear();
                        cachedAltResultsForEpisode = null;
                        autoSwitchInProgress = false;
                    }
                    currentEpisodeAttemptKey = nextAttemptKey;

                    const curApi = document.getElementById('site-select').value;
                    if (curApi) triedEpisodeApis.add(curApi);

                    currentEpName = ep.name;
                    currentStreamUrl = ep.url;

                    const resumeSec = (index === defaultPlayIndex && startTime > 0) ? startTime : 0;
                    playStream(ep.url, `${vod.vod_name} - ${ep.name}`, resumeSec);
                    saveWatchHistory(vod, ep.name, ep.url, resumeSec);
                };
                epContainer.appendChild(btn);

                if (index === defaultPlayIndex) {
                    btn.click();
                }
            });
        }

        // ==========================================
        // 播放器中央轉圈 Loading + 即時下載速度 & 智慧死鏈偵測引擎
        // ==========================================
        let loadingWatchdogTimer = null;
        let lastDataActivityTime = 0;
        let hasReceivedAnyData = false;
        let lastBufferedEnd = 0;
        let currentSpeedStr = '0 KB/s';

        function formatSpeed(bytesPerSec) {
            if (!bytesPerSec || bytesPerSec <= 0) return '0 KB/s';
            if (bytesPerSec >= 1024 * 1024) {
                return `${(bytesPerSec / (1024 * 1024)).toFixed(2)} MB/s`;
            }
            return `${Math.round(bytesPerSec / 1024)} KB/s`;
        }

        function getBufferedAhead() {
            try {
                if (video.buffered && video.buffered.length > 0) {
                    const end = video.buffered.end(video.buffered.length - 1);
                    return Math.max(0, end - (video.currentTime || 0));
                }
            } catch (e) {}
            return 0;
        }

        function showPlayerLoading(speedLabel = '正在連線片源...', subLabel = '偵測串流中', showSwitchBtn = false, showSpin = true, switchBtnText = '', switchBtnDisabled = false) {
            if (!loadingOverlay) return;
            loadingSpinner.style.display = showSpin ? 'block' : 'none';
            loadingSpeedText.textContent = speedLabel;
            loadingSpeedText.style.color = showSwitchBtn ? '#ff6b6b' : '#00ff88';
            loadingStatusSub.textContent = subLabel;
            if (showSwitchBtn) {
                btnDeadLinkSwitch.style.display = 'inline-block';
                btnDeadLinkSwitch.disabled = !!switchBtnDisabled;
                btnDeadLinkSwitch.textContent = switchBtnText || '🔄 正在搜尋其他直鏈來源...';
            } else {
                btnDeadLinkSwitch.style.display = 'none';
            }
            loadingOverlay.classList.add('show');
        }

        function hidePlayerLoading() {
            if (!loadingOverlay) return;
            loadingOverlay.classList.remove('show');
            btnDeadLinkSwitch.style.display = 'none';
        }

        function stopLoadingWatchdog() {
            if (loadingWatchdogTimer) {
                clearInterval(loadingWatchdogTimer);
                loadingWatchdogTimer = null;
            }
        }

        function startLoadingWatchdog() {
            stopLoadingWatchdog();
            const startTime = Date.now();
            lastDataActivityTime = startTime;
            hasReceivedAnyData = false;
            lastBufferedEnd = 0;
            currentSpeedStr = '0 KB/s';

            showPlayerLoading('載入中... 0 KB/s', '正在連線伺服器', false, true);

            loadingWatchdogTimer = setInterval(() => {
                // 1. 使用者手動暫停時，絕對不顯示轉圈或換源提示，並持續刷新活動時間避免恢復播放時誤判超時
                if (video.paused && !video.ended) {
                    lastDataActivityTime = Date.now();
                    hidePlayerLoading();
                    return;
                }

                // 2. 若影片已順暢播放且未處於等待緩衝狀態，自動隱藏 Loading
                if (!video.paused && video.readyState >= 3 && !video.seeking) {
                    hidePlayerLoading();
                    return;
                }

                const now = Date.now();
                const elapsedSec = (now - startTime) / 1000;
                const idleSec = (now - lastDataActivityTime) / 1000;

                // 檢查瀏覽器緩衝區是否有在推進（特別針對 iPhone 原生播放器）
                let currentBufEnd = 0;
                try {
                    if (video.buffered && video.buffered.length > 0) {
                        currentBufEnd = video.buffered.end(video.buffered.length - 1);
                    }
                } catch (e) {}

                if (currentBufEnd > lastBufferedEnd + 0.05) {
                    lastBufferedEnd = currentBufEnd;
                    lastDataActivityTime = now;
                    hasReceivedAnyData = true;
                }

                const isDownloading = (idleSec < 2.5);

                if (isDownloading) {
                    // 有數據正在下載：顯示即時網速或已緩衝秒數，延長寬限期至 30 秒不誤判
                    const bufAhead = getBufferedAhead().toFixed(1);
                    const speedDisplay = (currentSpeedStr !== '0 KB/s')
                        ? `載入中... ${currentSpeedStr}`
                        : `緩衝中... (已載入 ${bufAhead}s)`;
                    showPlayerLoading(speedDisplay, '串流數據下載中，請稍候', false, true);

                    if (elapsedSec > 30) {
                        showPlayerLoading(speedDisplay, '片源載入過慢，可嘗試切換其他直鏈', true, true);
                    }
                } else {
                    // 無任何下載跡象（0 KB/s 且緩衝區未動）：
                    // 若完全沒收到任何數據超過 10 秒，或中途斷流停滯超過 15 秒，啟動智慧自動換源（附防無限循環保護）
                    const deadThreshold = hasReceivedAnyData ? 15 : 10;
                    if (idleSec >= deadThreshold) {
                        handleDeadLinkDetected('該來源連線逾時無回應');
                    } else {
                        const remainWait = Math.max(1, Math.ceil(deadThreshold - idleSec));
                        showPlayerLoading(
                            `等待回應... ${currentSpeedStr}`,
                            `若無數據將於 ${remainWait} 秒後自動換源`,
                            false,
                            true
                        );
                    }
                }
            }, 600);
        }

        // 監聽原生 video 播放與緩衝事件
        video.addEventListener('pause', () => {
            hidePlayerLoading();
        });

        video.addEventListener('play', () => {
            lastDataActivityTime = Date.now();
        });

        video.addEventListener('waiting', () => {
            if (currentStreamUrl && !video.paused) {
                showPlayerLoading(
                    currentSpeedStr !== '0 KB/s' ? `緩衝中... ${currentSpeedStr}` : '正在緩衝畫面...',
                    '網路波動緩衝中',
                    false,
                    true
                );
            }
        });

        video.addEventListener('playing', () => {
            hasReceivedAnyData = true;
            lastDataActivityTime = Date.now();
            hidePlayerLoading();
        });

        video.addEventListener('canplay', () => {
            if (!video.paused) {
                hidePlayerLoading();
            }
        });

        // ==========================================
        // 智慧「一鍵換源」引擎（動態讀取使用者上傳設定檔的直鏈站點）
        // ==========================================
        let isSearchingSources = false;

        function normalizeTitleForMatch(str) {
            return (str || '')
                .toLowerCase()
                .replace(/[\s\-_：:（）()【】\[\]第季部集全HD高清藍光]/g, '');
        }

        function extractEpisodeListFromVod(vod) {
            const playUrls = vod.vod_play_url || '';
            const epList = [];
            const servers = playUrls.split('$$$');
            let m3u8Group = servers.find(s => s.includes('.m3u8')) || servers[0] || '';
            const episodes = m3u8Group.split('#');
            episodes.forEach(item => {
                const parts = item.split('$');
                if (parts.length >= 2) {
                    epList.push({ name: parts[0].trim(), url: parts[1].trim() });
                } else if (parts[0] && parts[0].startsWith('http')) {
                    epList.push({ name: '播放', url: parts[0].trim() });
                }
            });
            return epList;
        }

        function normalizeEpLabel(str) {
            return (str || '').toLowerCase().replace(/[\s\-_第集期話话回全]/g, '');
        }

        function matchEpisodeFromList(epList, targetEpName) {
            if (!epList || epList.length === 0) return null;
            if (!targetEpName) return epList[0];

            // 1. 精準比對集數名稱（例如「第1179集」===「第1179集」）
            let found = epList.find(e => e.name === targetEpName);
            if (found) return found;

            // 2. 去除「第/集/話/期」等裝飾字後比對（例如「第1179集」vs「1179」vs「第1179話」）
            const normTarget = normalizeEpLabel(targetEpName);
            if (normTarget) {
                found = epList.find(e => normalizeEpLabel(e.name) === normTarget);
                if (found) return found;
            }

            // 3. 嚴格提取集數數字比對（例如「第1179集」只會匹配數字為 1179 的集數，絕不拿第01集魚目混珠）
            const numMatch = targetEpName.match(/(\d+)/);
            if (numMatch) {
                const targetNum = parseInt(numMatch[1], 10);
                found = epList.find(e => {
                    const m = e.name.match(/(\d+)/);
                    return m && parseInt(m[1], 10) === targetNum;
                });
                if (found) return found;
            }

            // 找不到完全符合的集數時直接回傳 null（寧缺勿濫，絕不抓不相干的第1集）
            return null;
        }

        async function searchAvailableDirectSources() {
            if (cachedAltResultsForEpisode && cachedAltResultsForEpisode.key === currentEpisodeAttemptKey) {
                return cachedAltResultsForEpisode.results;
            }

            const candidateSites = (localPresetSites || []).filter(s => s && s.api && s.api.startsWith('http'));
            if (candidateSites.length === 0) return [];

            let searchWord = currentVod.vod_name;
            if (converter) {
                try { searchWord = await converter(searchWord); } catch (e) {}
            }
            let aliasCandidates = resolveAliasKeywords(currentVod.vod_name);
            if (aliasCandidates.length === 0) {
                aliasCandidates = await fetchWikidataAliases(currentVod.vod_name);
            }
            let altSearchWord = '';
            if (aliasCandidates.length > 0) {
                altSearchWord = converter ? await converter(aliasCandidates[0]) : aliasCandidates[0];
            }

            const targetNorm = normalizeTitleForMatch(currentVod.vod_name);

            const tasks = candidateSites.map(async (site) => {
                try {
                    const query = `api=${encodeURIComponent(site.api)}&pg=1&wd=${encodeURIComponent(searchWord)}`;
                    const res = await fetch(`/api/cms/list?${query}`);
                    const data = await res.json();
                    let list = data.list || [];
                    if (list.length === 0 && altSearchWord && altSearchWord !== searchWord) {
                        const altQuery = `api=${encodeURIComponent(site.api)}&pg=1&wd=${encodeURIComponent(altSearchWord)}`;
                        const altRes = await fetch(`/api/cms/list?${altQuery}`);
                        const altData = await altRes.json();
                        list = altData.list || [];
                    }
                    if (list.length === 0) return null;

                    // 先篩選出片名吻合的候選條目（依精準度排序，例如《蠟筆小新》可能有劇場版與連載版多筆結果）
                    const titleMatchedVods = list.filter(v => {
                        const vNorm = normalizeTitleForMatch(v.vod_name);
                        return v.vod_name === currentVod.vod_name ||
                               vNorm === targetNorm ||
                               (targetNorm.length >= 2 && (vNorm.includes(targetNorm) || targetNorm.includes(vNorm)));
                    }).sort((a, b) => {
                        const aExact = (a.vod_name === currentVod.vod_name || normalizeTitleForMatch(a.vod_name) === targetNorm) ? 1 : 0;
                        const bExact = (b.vod_name === currentVod.vod_name || normalizeTitleForMatch(b.vod_name) === targetNorm) ? 1 : 0;
                        return bExact - aExact;
                    });

                    // 逐一檢查所有同名條目，找出真正包含目標集數（如「第1179集」）的那一筆
                    for (const candidateVod of titleMatchedVods) {
                        const epList = extractEpisodeListFromVod(candidateVod);
                        const matchedEp = matchEpisodeFromList(epList, currentEpName);
                        if (matchedEp && matchedEp.url) {
                            return {
                                siteName: site.name.replace(/\s*\(直鏈\)/g, ''),
                                siteApi: site.api,
                                vod: candidateVod,
                                ep: matchedEp
                            };
                        }
                    }

                    // 該站點沒有任何條目收錄此集數 -> 排除該站
                    return null;
                } catch (e) {
                    return null;
                }
            });

            const results = (await Promise.all(tasks)).filter(Boolean);
            cachedAltResultsForEpisode = { key: currentEpisodeAttemptKey, results };
            return results;
        }

        function switchToAlternativeSourceItem(item, isAuto = false) {
            if (!item || !item.siteApi) return;
            triedEpisodeApis.add(item.siteApi);

            const siteSelect = document.getElementById('site-select');
            if (siteSelect) {
                siteSelect.value = item.siteApi;
            }

            const resumeSec = (video && video.currentTime > 3) ? video.currentTime : 0;
            // 保留當前這一集的 triedEpisodeApis，防止無限循環
            renderEpisodes(item.vod, item.ep.name, resumeSec, true);

            skipToast.textContent = isAuto
                ? `⚡ 原來源無回應，已自動改用【${item.siteName}】(${item.ep.name})`
                : `🔄 已切換至【${item.siteName}】- ${item.ep.name}`;
            skipToast.style.display = 'block';
            setTimeout(() => { skipToast.style.display = 'none'; }, 3000);
        }

        async function handleDeadLinkDetected(reasonText = '該來源連線逾時') {
            if (autoSwitchInProgress || !currentVod || !currentVod.vod_name) return;

            const candidateSites = (localPresetSites || []).filter(s => s && s.api && s.api.startsWith('http'));
            if (candidateSites.length === 0) {
                showPlayerLoading('⚠️ 0 KB/s (無回應)', '請先載入設定檔以啟用自動換源', true, false, '⚠️ 尚未載入直鏈設定檔', true);
                return;
            }

            autoSwitchInProgress = true;
            const curApi = document.getElementById('site-select').value;
            if (curApi) triedEpisodeApis.add(curApi);

            showPlayerLoading('⚠️ 0 KB/s (無回應)', '正在自動尋找其他可用直鏈...', true, true, '🔍 搜尋替代直鏈中...', true);

            const results = await searchAvailableDirectSources();
            // 過濾出「有這部片且本集尚未嘗試過」的站點（防無限循環熔斷）
            const untriedAlternatives = results.filter(r => !triedEpisodeApis.has(r.siteApi));

            if (untriedAlternatives.length === 0) {
                // 全網僅 1 個來源，或所有有此片的站點本集都已試過一輪 -> 熔斷停止，不盲目空轉
                const onlyOneSource = (results.length <= 1);
                const msgTitle = onlyOneSource ? '⚠️ 僅此 1 站有資源 (無其他源)' : `❌ 已試遍所有 ${results.length} 個可用直鏈`;
                const subMsg = onlyOneSource ? '其他直鏈站點均無收錄此影片' : '目前所有來源皆無回應，已停止自動切換';
                showPlayerLoading('⚠️ 無法播放', subMsg, true, false, msgTitle, true);
                return;
            }

            const nextTarget = untriedAlternatives[0];
            showPlayerLoading(
                '⚠️ 來源無回應',
                `即將自動改用【${nextTarget.siteName}】`,
                true,
                true,
                `🔄 改用【${nextTarget.siteName}】播放`,
                false
            );

            setTimeout(() => {
                // 確認在倒數期間使用者沒有手動切換別集或按下暫停
                if (!video.paused && getEpisodeAttemptKey(currentVod && currentVod.vod_name, currentEpName) === currentEpisodeAttemptKey) {
                    autoSwitchInProgress = false;
                    switchToAlternativeSourceItem(nextTarget, true);
                } else {
                    autoSwitchInProgress = false;
                }
            }, 900);
        }

        async function triggerSmartSourceSwitch(autoPlayFirst = false) {
            if (!currentVod || !currentVod.vod_name) {
                alert('請先選擇一部影片後再使用換源功能');
                return;
            }

            const candidateSites = (localPresetSites || []).filter(s => s && s.api && s.api.startsWith('http'));
            if (candidateSites.length === 0) {
                alert('尚未偵測到設定檔內的直鏈站點！請先點擊左上角「📁 載入設定檔」上傳您的 .txt 設定檔。');
                return;
            }

            if (isSearchingSources) return;
            isSearchingSources = true;

            const origBtnText = btnSwitchSource ? btnSwitchSource.textContent : '🔄 換源';
            if (btnSwitchSource) {
                btnSwitchSource.disabled = true;
                btnSwitchSource.textContent = '🔍 搜尋中...';
            }

            const currentApi = document.getElementById('site-select').value;
            if (currentApi) triedEpisodeApis.add(currentApi);

            const results = await searchAvailableDirectSources();
            isSearchingSources = false;

            if (btnSwitchSource) {
                btnSwitchSource.disabled = false;
                btnSwitchSource.textContent = origBtnText;
            }

            const epLabel = currentEpName || '此集';
            const otherStations = results.filter(r => r.siteApi !== currentApi);

            // 若全網直鏈站點搜完，僅目前這 1 個站點有收錄此集 -> 直接跳出明確提示，不進行無意義切換
            if (otherStations.length === 0) {
                const curName = getSiteNameByApi(currentApi) || '目前站點';
                closeAltSourcesPanel();
                skipToast.textContent = `⚠️ 僅【${curName}】有「${epLabel}」，其他直鏈站點均無收錄此集`;
                skipToast.style.display = 'block';
                setTimeout(() => { skipToast.style.display = 'none'; }, 3200);
                return;
            }

            // 優先挑選「本集尚未試過」的下一站；若手動把所有站點都按過一輪了，則重置循環並切到下一個不同站點
            let untried = otherStations.filter(r => !triedEpisodeApis.has(r.siteApi));
            if (untried.length === 0) {
                triedEpisodeApis.clear();
                if (currentApi) triedEpisodeApis.add(currentApi);
                untried = otherStations;
            }

            const nextTarget = untried[0];
            if (nextTarget) {
                switchToAlternativeSourceItem(nextTarget, false);
            }
        }

        // ==========================================
        // 核心播放控制 (秒開配置 + 原地斷線救援 + 網速監控)
        // ==========================================
        function playStream(rawUrl, title, startTime = 0) {
            isTriggeringNext = false;
            updateOpEdUI();
            updatePlayingTitle(`準備載入：${title}`);
            startLoadingWatchdog();

            const proxiedUrl = `/api/proxy-m3u8?url=${encodeURIComponent(rawUrl)}`;

            const rule = getCurrentOpEd();
            let targetStart = 0;
            let toastMsg = '';
            if (startTime > 0) {
                targetStart = startTime;
                toastMsg = `▶ 已自動接續至：${formatProgressChinese(startTime)}`;
            } else if (rule && rule.op > 0) {
                targetStart = rule.op;
                toastMsg = `⏭ 已為全劇自動跳過片頭至：${formatTime(rule.op)}`;
            }

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            let hasFallenBackToRaw = false;

            const applyStartTime = () => {
                if (targetStart > 0) {
                    video.currentTime = targetStart;
                    skipToast.textContent = toastMsg;
                    skipToast.style.display = 'block';
                    setTimeout(() => { skipToast.style.display = 'none'; }, 2500);
                }
            };

            if (Hls.isSupported()) {
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    fragLoadingTimeOut: 20000
                });

                // 攔截切片下載事件計算即時下載速度 (MB/s 或 KB/s)
                hlsInstance.on(Hls.Events.FRAG_LOADED, (event, data) => {
                    hasReceivedAnyData = true;
                    lastDataActivityTime = Date.now();
                    try {
                        const stats = data.frag && data.frag.stats;
                        if (stats && stats.loading) {
                            const bytes = stats.loaded || stats.total || 0;
                            const durationMs = Math.max(1, (stats.loading.end || performance.now()) - (stats.loading.start || performance.now()));
                            const bps = (bytes * 1000) / durationMs;
                            currentSpeedStr = formatSpeed(bps);
                        }
                    } catch (e) {}
                });

                hlsInstance.on(Hls.Events.MANIFEST_LOADED, () => {
                    lastDataActivityTime = Date.now();
                });

                hlsInstance.loadSource(proxiedUrl);
                hlsInstance.attachMedia(video);

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    updatePlayingTitle(`${title}`);
                    setMasterVolume(uiVolumeLevel, isAppMuted);
                    video.play().then(() => {
                        playBtn.textContent = '❚❚';
                        applyStartTime();
                    }).catch(e => console.log('等待點擊播放', e));
                });

                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        if (!hasFallenBackToRaw && (!video.currentTime || video.currentTime < 2)) {
                            hasFallenBackToRaw = true;
                            console.log('代理載入失敗，切換直鏈播放');
                            hlsInstance.loadSource(rawUrl);
                            return;
                        }

                        const savedTime = (video && video.currentTime > 1) ? video.currentTime : targetStart;
                        console.warn(`[播放中斷救援] 在 ${savedTime} 秒遇到錯誤:`, data.type);

                        if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                            hlsInstance.recoverMediaError();
                        } else if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                            handleDeadLinkDetected('該片源伺服器無法連線');
                        } else {
                            handleDeadLinkDetected('片源串流解析異常');
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = proxiedUrl;
                const onMeta = () => {
                    hasReceivedAnyData = true;
                    lastDataActivityTime = Date.now();
                    updatePlayingTitle(`${title}`);
                    setMasterVolume(uiVolumeLevel, isAppMuted);
                    applyStartTime();
                    video.removeEventListener('loadedmetadata', onMeta);
                };
                const onErr = () => {
                    handleDeadLinkDetected('iOS 播放器無法載入此片源');
                    video.removeEventListener('error', onErr);
                };
                video.addEventListener('loadedmetadata', onMeta);
                video.addEventListener('error', onErr);
                video.play().catch(() => {});
            }
        }

        // ==========================================
        // 全劇片頭 / 片尾記憶規則管理
        // ==========================================
        let isTriggeringNext = false;

        function getOpEdRules() {
            try { return JSON.parse(localStorage.getItem('tvbox_op_ed_rules') || '{}'); } catch(e) { return {}; }
        }

        function saveOpEdRules(rules) {
            localStorage.setItem('tvbox_op_ed_rules', JSON.stringify(rules));
        }

        function getCurrentOpEd() {
            if (!currentVod || !currentVod.vod_name) return null;
            const rules = getOpEdRules();
            return rules[currentVod.vod_name] || null;
        }

        function updateOpEdUI() {
            const wrap = document.getElementById('op-ed-wrap');
            const btnOp = document.getElementById('btn-set-op');
            const btnEd = document.getElementById('btn-set-ed');
            if (!currentVod || !currentVod.vod_name) {
                if (wrap) wrap.style.display = 'none';
                return;
            }
            if (wrap) wrap.style.display = 'flex';

            const rule = getCurrentOpEd();
            if (rule && rule.op > 0) {
                btnOp.textContent = `⏭ ${formatTime(rule.op)}`;
                btnOp.classList.add('active');
            } else {
                btnOp.textContent = `⏭ 片頭`;
                btnOp.classList.remove('active');
            }

            if (rule && rule.edTail > 0) {
                btnEd.textContent = `⏮ -${formatTime(rule.edTail)}`;
                btnEd.classList.add('active');
            } else {
                btnEd.textContent = `⏮ 片尾`;
                btnEd.classList.remove('active');
            }
        }

        function toggleSetOp() {
            resetControlsTimer();
            if (!currentVod || !currentVod.vod_name) return;
            const rules = getOpEdRules();
            const name = currentVod.vod_name;
            const current = rules[name] || {};

            if (current.op > 0) {
                delete current.op;
                skipToast.textContent = `❌ 已取消《${name}》全劇片頭跳過`;
            } else {
                const t = Math.floor(video.currentTime || 0);
                if (t <= 5) return alert('請播放到片頭結束的位置再點擊記錄');
                current.op = t;
                skipToast.textContent = `✅ 已記住《${name}》片頭 (${formatTime(t)})，所有集數開始時將自動跳過`;
            }

            rules[name] = current;
            saveOpEdRules(rules);
            updateOpEdUI();
            skipToast.style.display = 'block';
            setTimeout(() => { skipToast.style.display = 'none'; }, 2800);
        }

        function toggleSetEd() {
            resetControlsTimer();
            if (!currentVod || !currentVod.vod_name || !video.duration) return;
            const rules = getOpEdRules();
            const name = currentVod.vod_name;
            const current = rules[name] || {};

            if (current.edTail > 0) {
                delete current.edTail;
                skipToast.textContent = `❌ 已取消《${name}》全劇片尾跳過`;
            } else {
                const remain = Math.floor(video.duration - video.currentTime);
                if (remain <= 5 || remain >= video.duration - 30) return alert('請播放到片尾曲即將開始的位置再點擊記錄');
                current.edTail = remain;
                skipToast.textContent = `✅ 已記住《${name}》片尾 (倒數 ${formatTime(remain)})，所有集數到此處將自動換集`;
            }

            rules[name] = current;
            saveOpEdRules(rules);
            updateOpEdUI();
            skipToast.style.display = 'block';
            setTimeout(() => { skipToast.style.display = 'none'; }, 2800);
        }

        function playNextEpisode(reason = '本集播放結束') {
            const epButtons = Array.from(document.querySelectorAll('.ep-btn'));
            const activeIdx = epButtons.findIndex(b => b.classList.contains('active'));

            if (activeIdx !== -1 && activeIdx + 1 < epButtons.length) {
                const nextBtn = epButtons[activeIdx + 1];
                skipToast.textContent = `▶ ${reason}，自動接續：${nextBtn.textContent}`;
                skipToast.style.display = 'block';

                setTimeout(() => {
                    skipToast.style.display = 'none';
                    nextBtn.click();
                }, 800);
            }
        }
    </script>
