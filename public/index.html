<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f0f0f">
    <title>Web TVBox 影視中心</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            overscroll-behavior: none;
            background: #0f0f0f;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f0f0f;
            color: #f1f1f1;
            padding: calc(16px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom)) 20px;
            transition: max-width 0.25s ease, padding 0.25s ease;
        }

        /* 頂部狀態列固定安全區遮罩（防止網頁捲動時文字與 iPhone 時間/劉海重疊） */
        .ios-status-bar-guard {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: env(safe-area-inset-top);
            background: #0f0f0f;
            z-index: 9000;
            pointer-events: none;
        }
        body.mobile-mode .ios-status-bar-guard {
            display: block;
        }
        body.lock-scroll .ios-status-bar-guard {
            display: none !important;
        }

        /* 全螢幕時徹底鎖死背景頁面，避免拖動或露白 */
        body.lock-scroll {
            overflow: hidden !important;
            background: #000 !important;
            padding: 0 !important;
        }
        body.lock-scroll > *:not(.main-layout) {
            display: none !important;
        }
        body.lock-scroll .main-layout {
            margin: 0 !important;
            padding: 0 !important;
            display: block !important;
        }
        body.lock-scroll .episodes-box,
        body.lock-scroll .player-bottom-bar {
            display: none !important;
        }

        /* 手機版樣式（加入頂部劉海與狀態列安全間距，避免按鈕與時間/訊號重疊） */
        body.mobile-mode {
            padding: max(48px, calc(14px + env(safe-area-inset-top))) max(10px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
            max-width: 480px;
            margin: 0 auto;
            border-left: 1px solid #222;
            border-right: 1px solid #222;
            min-height: 100vh;
        }
        @media (max-width: 899px) {
            body.mobile-mode {
                max-width: 100%;
                border: none;
            }
        }
        /* 手機橫放非全螢幕時減少頂部留白，保留安全區 */
        @media screen and (orientation: landscape) {
            body.mobile-mode {
                padding-top: max(12px, env(safe-area-inset-top));
            }
        }

        /* 頂部操作列 */
        .header {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            background: #181818;
            padding: 10px 16px;
            border-radius: 8px;
        }
        body.mobile-mode .header { gap: 8px; padding: 10px 12px; margin-bottom: 12px; }

        select, input, button {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #222;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        body.mobile-mode select,
        body.mobile-mode input,
        body.mobile-mode button { padding: 8px 10px; }

        button {
            cursor: pointer;
            background: #2a2a2a;
            border: 1px solid #444;
            font-weight: 500;
            transition: background 0.2s;
            touch-action: manipulation;
        }
        button:hover { background: #383838; }
        button:active { background: #444; }

        .btn-upload { background: #005533; border-color: #008855; color: #fff; font-weight: bold; white-space: nowrap; }
        .btn-upload:hover { background: #007744; }

        .btn-mode-switch {
            background: #1a2d42;
            border-color: #2c5282;
            color: #63b3ed;
            font-weight: bold;
            white-space: nowrap;
        }
        .btn-mode-switch:hover { background: #233c57; }
        body.mobile-mode .btn-mode-switch {
            background: #2d1f3d;
            border-color: #6b46c1;
            color: #d6bcfa;
        }

        .header-row-selects { display: flex; gap: 8px; align-items: center; flex: 0 1 auto; }
        body.mobile-mode .header-row-selects { width: 100%; gap: 6px; }
        body.mobile-mode .header-row-selects select { flex: 1; min-width: 90px; }

        .search-box { display: flex; gap: 6px; margin-left: auto; align-items: center; }
        .search-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
            width: 210px;
        }
        .search-input-wrap input {
            width: 100%;
            background: #121212;
            border: 1px solid #3a3a3a;
            padding-right: 30px;
        }
        .btn-clear-search {
            position: absolute;
            right: 6px;
            background: rgba(255, 255, 255, 0.14);
            border: none;
            color: #ccc;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 11px;
            padding: 0;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .btn-clear-search:hover { background: #e50914; color: #fff; }
        .btn-clear-search.visible { display: flex; }
        body.mobile-mode .search-box { width: 100%; margin-left: 0; margin-top: 2px; gap: 6px; }
        body.mobile-mode .search-input-wrap { flex: 1; width: auto; min-width: 0; }
        body.mobile-mode .search-box > button { flex-shrink: 0; padding: 8px 12px; }

        /* 語音搜尋按鈕 */
        .btn-voice {
            background: #262626;
            border: 1px solid #4a4a4a;
            color: #fff;
            padding: 8px 11px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .btn-voice:hover { background: #363636; border-color: #666; }
        .btn-voice.listening {
            background: #b91c1c;
            border-color: #ef4444;
            color: #fff;
            animation: voicePulse 1.1s infinite;
        }
        @keyframes voicePulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .ad-switch-box {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 6px;
            font-size: 13px;
            color: #00ff88;
            background: #1e2a22;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #235534;
        }
        .ad-switch-box input[type="checkbox"] { cursor: pointer; width: 16px; height: 16px; accent-color: #00cc66; flex-shrink: 0; }
        .ad-switch-box label { cursor: pointer; user-select: none; }
        body.mobile-mode .ad-switch-box { width: 100%; margin-left: 0; font-size: 12px; padding: 6px 10px; }

        /* 主排版 */
        .main-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; margin-bottom: 20px; }
        body.mobile-mode .main-layout { grid-template-columns: 1fr; gap: 14px; margin-bottom: 16px; }

        .player-column { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
        body.mobile-mode .player-column { gap: 8px; }

        .player-box {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            user-select: none;
            width: 100%;
        }
        body.mobile-mode .player-box {
            touch-action: none !important;
            overscroll-behavior: none !important;
        }

        /* Android / 桌面原生全螢幕 */
        .player-box:fullscreen,
        .player-box:-webkit-full-screen {
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            border-radius: 0 !important;
            touch-action: none !important;
            background: #000 !important;
        }

        /* iPhone (Safari & Chrome) 滿版全螢幕 */
        .player-box.pseudo-fullscreen {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            z-index: 99999 !important;
            border-radius: 0 !important;
            background: #000 !important;
            touch-action: none !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* 直立握持全螢幕時自動順時針旋轉 90 度 */
        @media screen and (orientation: portrait) {
            .player-box.pseudo-fullscreen.auto-rotate-landscape {
                inset: auto !important;
                width: 100vh !important;
                width: 100dvh !important;
                height: 100vw !important;
                top: 50% !important;
                left: 50% !important;
                transform: translate(-50%, -50%) rotate(90deg) !important;
                transform-origin: center center !important;
            }
        }

        .player-box.hide-cursor { cursor: none !important; }
        .player-box.hide-cursor * { cursor: none !important; }

        /* 全螢幕左上角片名與集數頂部浮動欄 */
        .video-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(rgba(0,0,0,0.88), transparent);
            padding: 14px max(20px, env(safe-area-inset-right)) 28px max(20px, env(safe-area-inset-left));
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease-in-out;
            z-index: 1200;
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .video-top-bar-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 4px rgba(0,0,0,0.95);
        }
        body.mobile-mode .video-top-bar {
            padding: max(12px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 24px max(18px, env(safe-area-inset-left));
            font-size: 14px;
        }
        .player-box:fullscreen .video-top-bar,
        .player-box:-webkit-full-screen .video-top-bar,
        .player-box.pseudo-fullscreen .video-top-bar {
            display: flex;
        }
        .video-top-bar.show { opacity: 1; pointer-events: auto; }

        .btn-exit-fs-top {
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.38);
            color: #fff;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            flex-shrink: 0;
        }

        video {
            width: 100%;
            height: 440px;
            background: #000;
            display: block;
            cursor: pointer;
            transition: filter 0.06s linear;
        }
        body.mobile-mode video {
            aspect-ratio: 16 / 9;
            height: auto;
            max-height: 70vh;
        }
        .player-box:fullscreen video,
        .player-box:-webkit-full-screen video,
        .player-box.pseudo-fullscreen video {
            width: 100% !important;
            height: 100% !important;
            max-height: none !important;
            aspect-ratio: auto !important;
            object-fit: contain !important;
        }

        /* 播放器中央轉圈 Loading + 即時下載速度 OSD */
        .player-loading-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 14px;
            padding: 16px 24px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            z-index: 2300;
            backdrop-filter: blur(8px);
            min-width: 170px;
            text-align: center;
            box-shadow: 0 6px 24px rgba(0,0,0,0.65);
        }
        .player-loading-overlay.show {
            display: flex;
        }
        .loading-spinner {
            width: 34px;
            height: 34px;
            border: 3.5px solid rgba(255, 255, 255, 0.2);
            border-top-color: #00ff88;
            border-radius: 50%;
            animation: spinLoader 0.85s linear infinite;
        }
        @keyframes spinLoader {
            to { transform: rotate(360deg); }
        }
        .loading-speed-text {
            font-size: 13px;
            font-weight: bold;
            color: #00ff88;
            font-family: monospace;
            white-space: nowrap;
        }
        .loading-status-sub {
            font-size: 11px;
            color: #ccc;
        }
        .btn-dead-link-switch {
            margin-top: 4px;
            background: #e50914;
            border: 1px solid #ff4d4d;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(229, 9, 20, 0.5);
            animation: voicePulse 1.3s infinite;
        }
        .btn-dead-link-switch:hover {
            background: #ff1e27;
        }

        /* 選集列表上方的「一鍵換源」面板 */
        .source-switch-bar {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-switch-source {
            background: #1b2e3c;
            border: 1px solid #2b6cb0;
            color: #63b3ed;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .btn-switch-source:hover {
            background: #253f52;
            color: #fff;
        }
        .alt-sources-panel {
            display: none;
            background: #12171d;
            border: 1px solid #263849;
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 10px;
            flex-direction: column;
            gap: 6px;
        }
        .alt-sources-panel.show {
            display: flex;
        }
        .alt-sources-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #90cdf4;
            font-weight: bold;
        }
        .alt-sources-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .alt-source-chip {
            background: #1e293b;
            border: 1px solid #38bdf8;
            color: #e0f2fe;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .alt-source-chip:hover {
            background: #0284c7;
            color: #fff;
        }
        .alt-source-chip.active-source {
            background: #006633;
            border-color: #00ff88;
            color: #fff;
            font-weight: bold;
        }

        /* 手機端手勢即時 OSD */
        .gesture-osd {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.84);
            border: 1px solid rgba(255, 255, 255, 0.28);
            color: #fff;
            padding: 14px 24px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.12s ease;
            backdrop-filter: blur(8px);
            z-index: 2500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            min-width: 175px;
            text-align: center;
        }
        .gesture-osd.show { opacity: 1; }
        .gesture-osd-sub {
            font-size: 12px;
            color: #00ff88;
            font-family: monospace;
        }
        .gesture-osd-bar {
            width: 100%;
            height: 5px;
            background: rgba(255,255,255,0.25);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }
        .gesture-osd-fill {
            height: 100%;
            background: #00ff88;
            width: 50%;
            transition: background-color 0.15s;
        }

        /* 底部控制列：一般模式獨立接在影片下方（100%不遮擋畫面與字幕），全螢幕模式浮動於底部並自動淡出 */
        .custom-controls {
            position: relative;
            width: 100%;
            background: #141414;
            border-top: 1px solid #242424;
            display: flex;
            flex-direction: column;
            padding: 6px 14px 10px;
            gap: 4px;
            opacity: 1;
            pointer-events: auto;
            transition: opacity 0.25s ease-in-out;
            z-index: 1200;
        }
        body.mobile-mode .custom-controls {
            padding: 5px 10px 8px;
            gap: 3px;
        }
        .player-box:fullscreen .custom-controls,
        .player-box:-webkit-full-screen .custom-controls,
        .player-box.pseudo-fullscreen .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            border-top: none;
            background: linear-gradient(transparent, rgba(0,0,0,0.95));
            padding: 8px max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            opacity: 0;
            pointer-events: none;
        }
        .player-box:fullscreen .custom-controls.show,
        .player-box:-webkit-full-screen .custom-controls.show,
        .player-box.pseudo-fullscreen .custom-controls.show {
            opacity: 1;
            pointer-events: auto;
        }

        .progress-bar-wrap {
            width: 100%;
            height: 20px;
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
            touch-action: none;
        }
        .progress-bar-bg {
            width: 100%;
            height: 5px;
            background: rgba(255,255,255,0.28);
            border-radius: 3px;
            position: relative;
            transition: height 0.15s;
        }
        .progress-bar-wrap:hover .progress-bar-bg { height: 7px; }
        .progress-bar-fill { height: 100%; background: #e50914; border-radius: 3px; width: 0%; pointer-events: none; }

        .controls-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%; min-width: 0; }
        .controls-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex-shrink: 1; }
        .controls-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        body.mobile-mode .controls-left { gap: 4px; }
        body.mobile-mode .controls-right { gap: 4px; }

        .ctrl-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            flex-shrink: 0;
        }
        #fs-btn {
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 5px;
            padding: 4px 8px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .ctrl-btn:hover { color: #e50914; }
        body.mobile-mode .ctrl-btn { font-size: 15px; padding: 4px 5px; }

        .time-display { font-size: 13px; color: #ddd; font-family: monospace; user-select: none; white-space: nowrap; }
        body.mobile-mode .time-display { font-size: 10.5px; }

        .volume-box { display: flex; align-items: center; gap: 8px; }
        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 85px;
            height: 5px;
            background: #555;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
            margin: 0;
            padding: 0;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 4px rgba(0,0,0,0.6);
            transition: transform 0.1s;
        }
        .volume-slider::-webkit-slider-thumb:hover { transform: scale(1.25); background: #e50914; }
        .volume-slider::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: #fff; border: none; cursor: pointer; }
        .volume-pct-label { font-size: 11px; color: #bbb; font-family: monospace; min-width: 34px; }
        body.mobile-mode .volume-slider,
        body.mobile-mode .volume-pct-label { display: none; }

        .seek-ripple {
            position: absolute;
            top: 50%;
            transform: translateY(-50%) scale(0.7);
            background: rgba(0, 0, 0, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            padding: 16px 28px;
            border-radius: 35px;
            font-size: 16px;
            font-weight: bold;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            backdrop-filter: blur(6px);
            z-index: 2200;
        }
        body.mobile-mode .seek-ripple { padding: 12px 20px; font-size: 14px; border-radius: 25px; }
        .seek-ripple.active { opacity: 1; transform: translateY(-50%) scale(1.05); }
        #ripple-left { left: 10%; }
        #ripple-right { right: 10%; }

        .skip-toast {
            position: absolute;
            top: 48px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 204, 102, 0.95);
            color: #000;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: none;
            z-index: 2200;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            pointer-events: none;
            white-space: nowrap;
        }
        body.mobile-mode .skip-toast { top: 44px; padding: 6px 14px; font-size: 12px; }

        .player-bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 16px;
            background: #181818;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
        }
        body.mobile-mode .player-bottom-bar { padding: 10px 14px; }

        function resolveAliasKeywords(rawInput) {
            const trimmed = (rawInput || '').trim();
            if (!trimmed) return [];
            const normInput = trimmed.toLowerCase().replace(/[\s：:·\-_]/g, '');
            const aliases = new Set();

            TW_CN_TITLE_ALIASES.forEach(([tw, cn]) => {
                const normTw = tw.toLowerCase().replace(/[\s：:·\-_]/g, '');
                const normCn = cn.toLowerCase().replace(/[\s：:·\-_]/g, '');
                if (normInput === normTw || normTw.includes(normInput) || normInput.includes(normTw)) {
                    aliases.add(cn);
                }
                if (normInput === normCn || normCn.includes(normInput) || normInput.includes(normCn)) {
                    aliases.add(tw);
                }
            });

            return Array.from(aliases);

        function cleanupVoiceRecognizer(forceAbort = false) {
            isVoiceListening = false;
            voiceSearchBtn.classList.remove('listening');
            voiceSearchBtn.textContent = '🎤';
            document.getElementById('search-input').placeholder = '繁簡皆可或點擊語音...';
            if (speechRecognition) {
                const rec = speechRecognition;
                speechRecognition = null;
                try {
                    rec.onresult = null;
                    rec.onerror = null;
                    rec.onend = null;
                    if (forceAbort && rec.abort) {
                        rec.abort();
                    } else if (rec.stop) {
                        rec.stop();
                    }
                } catch (e) {}
            }
        }

        function startVoiceSearch() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('您目前的瀏覽器不支援網頁語音辨識，建議使用手機鍵盤上的麥克風圖示進行語音輸入。');
                return;
            }

            if (isVoiceListening || speechRecognition) {
                cleanupVoiceRecognizer(true);
                return;
            }

            try {
                speechRecognition = new SpeechRecognition();
                speechRecognition.lang = 'zh-TW';
                speechRecognition.continuous = false;
                speechRecognition.interimResults = false;
                speechRecognition.maxAlternatives = 1;

                speechRecognition.onstart = () => {
                    isVoiceListening = true;
                    voiceSearchBtn.classList.add('listening');
                    voiceSearchBtn.textContent = '⏹';
                    document.getElementById('search-input').placeholder = '請說出想看的片名...';
                };

                speechRecognition.onresult = (event) => {
                    const transcript = (event.results && event.results[0] && event.results[0][0] && event.results[0][0].transcript) || '';
                    const cleaned = transcript.replace(/[。，！？、.!?,]/g, '').trim();
                    // 取得語音文字後立即強制 abort 並釋放實體，讓 iPhone 立刻結束麥克風與音訊錄製狀態
                    cleanupVoiceRecognizer(true);
                    if (cleaned) {
                        document.getElementById('search-input').value = cleaned;
                        toggleClearSearchBtn();
                        doSearch();
                    }
                };

                speechRecognition.onerror = (event) => {
                    console.warn('語音辨識錯誤:', event.error);
                    cleanupVoiceRecognizer(true);
                    if (event.error === 'not-allowed') {
                        alert('請允許瀏覽器使用麥克風權限，才能使用語音搜尋。');
                    }
                };

                speechRecognition.onend = () => {
                    cleanupVoiceRecognizer(false);
                };

                speechRecognition.start();

                cleanupVoiceRecognizer(true);
            }

        // ==========================================
        // 手機版全方位觸控手勢引擎（保持原設計不變）
        // - 雙擊左/右：倒退 10 秒 / 快轉 10 秒
        // - 左側上下滑動：調整亮度增加 / 減少
        // - 右側上下滑動：調整音量增加 / 減少 (0% ~ 100%)
        // - 左右水平滑動：控制進度條增加 / 減少
        // ==========================================
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;
        let touchGestureType = null; // 'brightness' | 'volume' | 'seek' | null
        let initialGestureVal = 0;
        let targetSeekTime = 0;
        let osdHideTimer = null;
        let lastTapTime = 0;
        let singleTapTimer = null;

        function showGestureOsd(label, barPercent, subText = '', showBar = true) {
            gestureOsdText.textContent = label;
            if (subText) {
                gestureOsdSub.textContent = subText;
                gestureOsdSub.style.display = 'block';
            } else {
                gestureOsdSub.style.display = 'none';
            }

            if (showBar) {
                gestureOsdBar.style.display = 'block';
                gestureOsdFill.style.width = `${Math.max(0, Math.min(100, barPercent))}%`;
            } else {
                gestureOsdBar.style.display = 'none';
            }

            gestureOsd.classList.add('show');
            clearTimeout(osdHideTimer);
            osdHideTimer = setTimeout(() => {
                gestureOsd.classList.remove('show');
            }, 950);
        }

        function getNormalizedTouchCoords(touch) {
            const rect = playerBox.getBoundingClientRect();
            const rawX = touch.clientX - rect.left;
            const rawY = touch.clientY - rect.top;

            if (isRotatedPortraitPseudoFs()) {
                return {
                    x: rawY,
                    y: rect.width - rawX,
                    width: rect.height,
                    height: rect.width
                };
            }
            return {
                x: rawX,
                y: rawY,
                width: rect.width,
                height: rect.height
            };
        }

        playerBox.addEventListener('touchstart', (e) => {
            if (!isMobileMode || e.touches.length !== 1) return;
            if (e.target.closest('.custom-controls') || e.target.closest('.video-top-bar') || e.target.closest('.player-loading-overlay')) {
                return;
            }

            const coords = getNormalizedTouchCoords(e.touches[0]);
            touchStartX = coords.x;
            touchStartY = coords.y;
            touchStartTime = Date.now();
            touchGestureType = null;
        }, { passive: false });

        playerBox.addEventListener('touchmove', (e) => {
            if (!isMobileMode || e.touches.length !== 1) return;
            if (e.target.closest('.custom-controls') || e.target.closest('.video-top-bar') || e.target.closest('.player-loading-overlay')) {
                return;
            }

            e.preventDefault();

            const coords = getNormalizedTouchCoords(e.touches[0]);
            const deltaX = coords.x - touchStartX;
            const deltaY = coords.y - touchStartY;

            if (!touchGestureType && (Math.abs(deltaX) > 10 || Math.abs(deltaY) > 10)) {
                if (Math.abs(deltaY) >= Math.abs(deltaX)) {
                    const isLeftHalf = touchStartX < (coords.width / 2);
                    if (isLeftHalf) {
                        touchGestureType = 'brightness';
                        initialGestureVal = videoBrightness;
                    } else {
                        touchGestureType = 'volume';
                        initialGestureVal = getEffectiveLevel(); // 0.0 ~ 1.0
                    }
                } else {
                    if (video.duration && !isNaN(video.duration)) {
                        touchGestureType = 'seek';
                        initialGestureVal = video.currentTime;
                        targetSeekTime = video.currentTime;
                    }
                }
            }

            if (touchGestureType === 'brightness') {
                const change = (-deltaY / coords.height) * 1.15;
                videoBrightness = Math.max(0.2, Math.min(1.3, initialGestureVal + change));
                video.style.filter = `brightness(${videoBrightness.toFixed(2)})`;
                const pct = Math.round(((videoBrightness - 0.2) / 1.1) * 100);
                showGestureOsd(`☀️ 亮度 ${pct}%`, pct);
            } else if (touchGestureType === 'volume') {
                const change = (-deltaY / coords.height) * 1.0;
                const newLvl = Math.max(0, Math.min(1.0, initialGestureVal + change));
                setMasterVolume(newLvl, newLvl <= 0.005);

                const displayPct = Math.round(newLvl * 100);
                const icon = displayPct === 0 ? '🔇' : '🔊';
                showGestureOsd(`${icon} 音量 ${displayPct}%`, displayPct, '', true);
            } else if (touchGestureType === 'seek' && video.duration) {
                const spanSeconds = Math.max(90, Math.min(300, video.duration * 0.35));
                const seekDelta = (deltaX / coords.width) * spanSeconds;
                targetSeekTime = Math.max(0, Math.min(video.duration, initialGestureVal + seekDelta));

                const diff = Math.round(targetSeekTime - initialGestureVal);
                const diffStr = diff >= 0 ? `+${diff}秒` : `${diff}秒`;
                const pct = (targetSeekTime / video.duration) * 100;
                showGestureOsd(
                    `${diff >= 0 ? '⏩' : '⏪'} ${formatTime(targetSeekTime)} / ${formatTime(video.duration)}`,
                    pct,
                    diffStr,
                    true
                );
            }
        }, { passive: false });

        playerBox.addEventListener('touchend', (e) => {
            if (!isMobileMode) return;
            if (e.target.closest('.custom-controls') || e.target.closest('.video-top-bar') || e.target.closest('.player-loading-overlay')) {
                return;
            }

            if (touchGestureType) {
                if (touchGestureType === 'seek' && video.duration) {
                    video.currentTime = targetSeekTime;
                }
                touchGestureType = null;
                return;
            }

            const touchDuration = Date.now() - touchStartTime;
            if (touchDuration > 320) return;

            e.preventDefault();
            const now = Date.now();
            const rect = playerBox.getBoundingClientRect();
            const visualWidth = isRotatedPortraitPseudoFs() ? rect.height : rect.width;
            const isLeftSide = touchStartX < (visualWidth / 2);

            if (now - lastTapTime < 280) {
                clearTimeout(singleTapTimer);
                lastTapTime = 0;
                if (isLeftSide) {
                    seekVideo(-10);
                    showRipple(rippleLeft);
                } else {
                    seekVideo(10);
                    showRipple(rippleRight);
                }
            } else {
                lastTapTime = now;

                    lastTapTime = 0;

                        if (customControls.classList.contains('show')) {

        // 電腦版滑鼠單擊播放/暫停、雙擊左/右快進快退
        let clickTimer = null;
        let clickCount = 0;

        video.addEventListener('click', (e) => {
            if (isMobileMode) return;
            clickCount++;
            const rect = video.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const isLeftSide = clickX < (rect.width / 2);

            if (clickCount === 1) {
                clickTimer = setTimeout(() => {
                    clickCount = 0;
                    togglePlayPause();
                }, 260);
            } else if (clickCount >= 2) {
                clearTimeout(clickTimer);
                clickTimer = null;
                clickCount = 0;

                if (isLeftSide) {
                    seekVideo(-10);
                    showRipple(rippleLeft);
                } else {
                    seekVideo(10);
                    showRipple(rippleRight);
                }
            }
        });

        // ==========================================
        // 時間格式化與進度條控制
        // ==========================================
        function formatTime(s) {
            if (isNaN(s)) return '00:00';
            const hrs = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = Math.floor(s % 60);
            if (hrs > 0) {
                return `${hrs}:${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
            }
            return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        }

        function formatProgressChinese(seconds, epName = '') {
            const s = Math.floor(seconds || 0);
            const hrs = Math.floor(s / 3600);
            const mins = Math.floor((s % 3600) / 60);
            const secs = s % 60;

            let timeStr = '';
            if (hrs > 0) {
                timeStr = `${hrs}小時${mins}分${secs}秒`;
            } else {
                timeStr = `${mins}分${secs}秒`;
            }

            if (epName && epName.trim() !== '') {
                return `${epName} ${timeStr}`;
            }
            return timeStr;
        }

        let lastAutoSaveTime = 0;
        video.addEventListener('timeupdate', () => {
            if (!video.duration) return;
            const pct = (video.currentTime / video.duration) * 100;
            progressFill.style.width = `${pct}%`;
            timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;

            const now = Date.now();
            if (now - lastAutoSaveTime > 3000 && currentVod && video.currentTime > 1) {
                lastAutoSaveTime = now;
                syncCurrentProgress(video.currentTime);
            }

            const opEd = getCurrentOpEd();
            if (opEd && opEd.edTail > 0 && video.duration > 0 && !isTriggeringNext && !video.paused) {
                const remain = video.duration - video.currentTime;
                if (remain <= opEd.edTail && video.currentTime > (opEd.op || 30) + 10) {
                    isTriggeringNext = true;
                    playNextEpisode('片尾倒數完畢');
                }
            }
        });

        video.addEventListener('pause', () => {
            if (currentVod && video.currentTime > 1) {
                syncCurrentProgress(video.currentTime);
            }
        });

        video.addEventListener('ended', () => {
            if (!isTriggeringNext) {
                playNextEpisode('本集播放結束');
            }
        });

        function handleSeekEvent(touchOrMouse) {
            const rect = progressWrap.getBoundingClientRect();
            let pos = 0;
            if (isRotatedPortraitPseudoFs()) {
                pos = (touchOrMouse.clientY - rect.top) / rect.height;
            } else {
                pos = (touchOrMouse.clientX - rect.left) / rect.width;
            }
            if (pos < 0) pos = 0;
            if (pos > 1) pos = 1;
            if (video.duration) {
                video.currentTime = pos * video.duration;
            }
        }

        progressWrap.addEventListener('click', (e) => {
            e.stopPropagation();
            handleSeekEvent(e);
        });

        progressWrap.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            if (e.touches && e.touches[0]) {
                handleSeekEvent(e.touches[0]);
            }
        }, { passive: true });

        progressWrap.addEventListener('touchmove', (e) => {
            e.stopPropagation();
            if (e.touches && e.touches[0]) {
                handleSeekEvent(e.touches[0]);
            }
        }, { passive: true });

        function seekVideo(seconds) {
            if (!video || !video.duration) return;
            let targetTime = video.currentTime + seconds;
            if (targetTime < 0) targetTime = 0;
            if (targetTime > video.duration) targetTime = video.duration;
            video.currentTime = targetTime;
        }

        // ==========================================
        // 澳門新葡京娛樂城 廣告文字偵測 (統一快進 26 秒)
        // ==========================================
        function triggerAdSkip(detectedText = '') {
            const now = Date.now();
            if (now - lastSkipTime < 3500) return;
            lastSkipTime = now;

            console.log(`%c[精準命中] 識別到廣告文字:「${detectedText}」，立即快進 26 秒！`, 'color:#00ff00; font-size:14px; font-weight:bold;');
            let target = video.currentTime + 26;
            if (video.duration && target > video.duration) target = video.duration;
            video.currentTime = target;

            skipToast.textContent = `⚡ 識別到「澳門新葡京」，已自動跳過 26 秒`;
            skipToast.style.display = 'block';
            setTimeout(() => { skipToast.style.display = 'none'; }, 2500);
        }

        setInterval(async () => {
            if (!aiAdSkipChk.checked || video.paused || video.ended || !video.duration || isOcrProcessing) return;

            const now = Date.now();
            if (now - lastSkipTime < 3500) return;

            try {
                const vw = video.videoWidth || 640;
                const vh = video.videoHeight || 360;

                const cropX = vw * 0.28;
                const cropY = vh * 0.26;
                const cropW = vw * 0.44;
                const cropH = vh * 0.32;

                ocrCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, 280, 100);

                const imgData = ocrCtx.getImageData(0, 0, 280, 100);
                const d = imgData.data;
                for (let i = 0; i < d.length; i += 4) {
                    const r = d[i], g = d[i+1];
                    if (r > 170 && g > 130) {
                        d[i] = 255; d[i+1] = 255; d[i+2] = 255;
                    } else {
                        d[i] = 0; d[i+1] = 0; d[i+2] = 0;
                    }
                }
                ocrCtx.putImageData(imgData, 0, 0);

                if (ocrWorker) {
                    isOcrProcessing = true;
                    const res = await ocrWorker.recognize(ocrCanvas);
                    isOcrProcessing = false;
                    const text = res.data.text.replace(/\s+/g, '');

                    const hasAoMen = text.includes('澳门') || text.includes('澳門');
                    const hasXinPuJing = text.includes('新葡京');
                    const isAoMenXinPuJing = hasAoMen && hasXinPuJing;

                    const extraKeywords = ['701701', '288588', '娱乐城', '娛樂城', '发财', '發財', '澳门新', '澳門新'];
                    const hasExtraMatch = extraKeywords.some(kw => text.includes(kw));

                    if (isAoMenXinPuJing || hasExtraMatch) {
                        triggerAdSkip(text);
                    }
                }
            } catch (err) {
                isOcrProcessing = false;
            }
        }, 800);

                e.preventDefault();
                const next = Math.min(1.0, Math.round((getEffectiveLevel() + 0.1) * 10) / 10);
                setMasterVolume(next, false);

        // ==========================================
        // 方案一：Wikidata 全球開源資料庫即時抓取兩岸譯名（附本機快取與 1.5 秒超時保護）
        // ==========================================
        function getWikidataAliasCache() {
            try { return JSON.parse(localStorage.getItem('tvbox_wikidata_aliases') || '{}'); } catch (e) { return {}; }
        }

        function saveWikidataAliasCache(cacheObj) {
            try {
                const keys = Object.keys(cacheObj);
                if (keys.length > 300) {
                    delete cacheObj[keys[0]];
                }
                localStorage.setItem('tvbox_wikidata_aliases', JSON.stringify(cacheObj));
            } catch (e) {}
        }

        async function fetchWikidataAliases(rawTitle) {
            const queryText = (rawTitle || '').trim();
            if (!queryText || queryText.length < 2) return [];

            // 1. 先檢查本機 Wikidata 快取（0 毫秒秒回）
            const cache = getWikidataAliasCache();
            if (Array.isArray(cache[queryText])) {
                return cache[queryText];
            }

            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 1600);

            try {
                // 2. 向 Wikidata 公開 API 搜尋條目 Q 碼（支援跨域 origin=*，不消耗後端流量）
                const searchUrl = `https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(queryText)}&language=zh-tw&uselang=zh-tw&type=item&limit=3&format=json&origin=*`;
                const sRes = await fetch(searchUrl, { signal: controller.signal });
                const sData = await sRes.json();
                const items = sData.search || [];
                if (items.length === 0) {
                    clearTimeout(timer);
                    return [];
                }

                // 優先挑選描述中包含電影、電視、動畫、漫畫、劇集等影視關鍵字的 Q 碼
                const mediaRegex = /電影|电影|電視|电视|動畫|动画|劇集|剧集|影集|漫畫|漫画|film|series|anime|drama|television/i;
                const sortedItems = [...items].sort((a, b) => {
                    const aScore = mediaRegex.test(a.description || '') ? 1 : 0;
                    const bScore = mediaRegex.test(b.description || '') ? 1 : 0;
                    return bScore - aScore;
                });

                const targetQids = sortedItems.slice(0, 2).map(it => it.id).join('|');

                // 3. 取得該 Q 碼的中國大陸簡體名稱（zh-cn）與別名（aliases）
                const entityUrl = `https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${encodeURIComponent(targetQids)}&props=labels|aliases&languages=zh-cn|zh-hans|zh-tw|zh-hk&format=json&origin=*`;
                const eRes = await fetch(entityUrl, { signal: controller.signal });
                const eData = await eRes.json();
                clearTimeout(timer);

                const foundAliases = new Set();
                const entities = eData.entities || {};
                Object.values(entities).forEach(ent => {
                    if (ent.labels) {
                        ['zh-cn', 'zh-hans', 'zh-tw', 'zh-hk'].forEach(lang => {
                            if (ent.labels[lang] && ent.labels[lang].value) {
                                foundAliases.add(ent.labels[lang].value.trim());
                            }
                        });
                    }
                    if (ent.aliases) {
                        ['zh-cn', 'zh-hans'].forEach(lang => {
                            if (Array.isArray(ent.aliases[lang])) {
                                ent.aliases[lang].slice(0, 2).forEach(a => {
                                    if (a && a.value && a.value.length <= 24) {
                                        foundAliases.add(a.value.trim());
                                    }
                                });
                            }
                        });
                    }
                });

                const resultList = Array.from(foundAliases).filter(v => v && v !== queryText);
                cache[queryText] = resultList;
                saveWikidataAliasCache(cache);
                return resultList;
            } catch (err) {
                clearTimeout(timer);
                return [];
            }
        }
